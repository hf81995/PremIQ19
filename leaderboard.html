<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PREMiQ19 Casino — Leaderboard</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PremIQ19">
<meta name="theme-color" content="#0F3D2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="questions-data.js"></script>
<style>
  :root{ --pitch-dark:#0B2E22; --pitch:#0F3D2C; --chalk:#F6F5EF; --chalk-dim:#EAE7DB; --ink:#122019; --ink-soft:#5C6B62; --line:#DCD8C9; --gold:#CBA633; }
  *{box-sizing:border-box;}
  body{ margin:0; background:radial-gradient(1200px 600px at 15% -10%, rgba(255,255,255,0.05), transparent 60%), var(--pitch-dark); font-family:'Inter',sans-serif; color:var(--ink); min-height:100vh; }
  .header{ background:linear-gradient(180deg, var(--pitch) 0%, var(--pitch-dark) 100%); padding:1.6rem 1rem 1.2rem; text-align:center; border-bottom:3px solid rgba(203,166,51,0.5); }
  .header h1{ font-family:'Bebas Neue',sans-serif; font-size:clamp(1.8rem,7vw,3rem); color:var(--chalk); margin:0; }
  .header h1 span{ color:var(--gold); }
  .header p{ color:#B9C4BB; font-size:0.78rem; margin:0.5rem 0 0; }
  a.back-link{ color:var(--gold); font-family:'Space Mono',monospace; font-size:0.7rem; text-decoration:underline; }
  .wrap{ max-width:1100px; margin:0 auto; padding:1.2rem 0.8rem 3rem; }

  .tab-bar{ display:flex; gap:1.1rem; margin-bottom:1rem; border-bottom:1.5px solid rgba(255,255,255,0.18); padding:0 0.2rem; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .tab-bar::-webkit-scrollbar{ display:none; }
  .tab-btn{ flex-shrink:0; }
  .tab-btn{ font-family:'Bebas Neue',sans-serif; font-size:1.05rem; letter-spacing:0.02em; background:none; border:none; border-bottom:3px solid transparent; color:#B9C4BB; padding:0.5rem 0.1rem; cursor:pointer; }
  .tab-btn.active{ color:var(--chalk); border-bottom-color:var(--gold); }

  .board{ background:var(--chalk); border-radius:16px; overflow-x:auto; overflow-y:hidden; box-shadow:0 20px 40px -20px rgba(0,0,0,0.4); -webkit-overflow-scrolling:touch; }
  .board table{ min-width:100%; }
  .empty{ text-align:center; padding:2rem; color:var(--ink-soft); font-size:0.85rem; }

  table{ width:100%; border-collapse:collapse; font-size:0.8rem; }
  th, td{ text-align:left; padding:0.55rem 0.6rem; border-bottom:1px solid var(--line); white-space:nowrap; }
  th{ font-family:'Space Mono',monospace; font-size:0.62rem; text-transform:uppercase; color:var(--ink-soft); }
  th.num, td.num{ text-align:right; }
  th .th-sub{ display:block; text-transform:none; font-size:0.6rem; color:var(--ink-soft); font-weight:400; margin-top:0.15rem; }

  .rank{ font-family:'Bebas Neue',sans-serif; font-size:1.15rem; color:var(--ink-soft); width:1.6rem; }
  tr:nth-child(1) .rank{ color:#CBA633; } tr:nth-child(2) .rank{ color:#8C9199; } tr:nth-child(3) .rank{ color:#B08050; }
  .pname{ font-weight:700; }
  .ptotal{ font-family:'Space Mono',monospace; font-weight:800; color:var(--pitch); }
  .psub{ font-family:'Space Mono',monospace; color:var(--ink-soft); }

  .legend-row{ display:flex; gap:1rem; padding:0.7rem 1rem; font-size:0.68rem; color:var(--ink-soft); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .legend-row span b{ color:var(--ink); }

  .player-select{
    width:100%; padding:0.6rem 0.7rem; border:1.5px solid var(--line); border-radius:9px; font-size:0.85rem;
    margin-bottom:0.8rem; font-family:'Inter',sans-serif; background:#fff;
  }
  .btn-results-toggle{
    font-family:'Bebas Neue',sans-serif; font-size:1rem; letter-spacing:0.02em; color:var(--pitch-dark);
    background:var(--gold); border:none; padding:0.65rem 1.4rem; border-radius:999px; cursor:pointer;
    box-shadow:0 8px 18px -8px rgba(0,0,0,0.4);
  }

  .slot-pick-correct{ background:rgba(203,166,51,0.22) !important; }
  .qa-correct{ background:rgba(46,139,87,0.14) !important; }
  .qa-points{ font-family:'Space Mono',monospace; font-weight:800; color:var(--pitch); font-size:0.72rem; background:rgba(203,166,51,0.18); border-radius:6px; }

  .month-collapse{
    background:var(--chalk); border-radius:16px; overflow:hidden; box-shadow:0 20px 40px -20px rgba(0,0,0,0.4);
    margin-bottom:1rem;
  }
  .month-collapse summary{
    list-style:none; cursor:pointer; padding:0.9rem 1.1rem; display:flex; align-items:center; justify-content:space-between;
    gap:0.6rem; font-size:0.85rem; background:var(--chalk-dim); flex-wrap:wrap;
  }
  .month-collapse summary::-webkit-details-marker{ display:none; }
  .month-collapse summary::before{ content:'▶'; margin-right:0.6rem; font-size:0.7rem; color:var(--ink-soft); transition:transform .15s ease; display:inline-block; }
  .month-collapse[open] summary::before{ transform:rotate(90deg); }
  .recap-summary-status{ font-family:'Space Mono',monospace; font-size:0.68rem; color:var(--ink-soft); }
  .month-collapse-body{ padding:0.9rem 1rem; }

  .recap-player-card{ border:1.5px solid var(--line); border-radius:12px; padding:0.7rem 0.85rem; margin-bottom:0.7rem; }
  .recap-player-card:last-child{ margin-bottom:0; }
  .recap-player-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:0.5rem; }
  .recap-player-name{ font-family:'Bebas Neue',sans-serif; font-size:1.05rem; }
  .recap-player-points{
    font-family:'Space Mono',monospace; font-weight:800; color:var(--ink); font-size:0.9rem;
    background:var(--gold); padding:0.25rem 0.65rem; border-radius:999px;
  }
  .recap-pick-line{ display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:0.35rem; }
  .recap-pick-line:last-child{ margin-bottom:0; }
  .recap-pick{
    display:flex; flex-direction:column; background:var(--chalk-dim); border-radius:8px; padding:0.3rem 0.5rem;
    flex:1 1 auto; min-width:90px; border:1.5px solid transparent;
  }
  .recap-pick-green{ background:rgba(46,139,87,0.16); border-color:rgba(46,139,87,0.4); }
  .recap-pick-red{ background:rgba(163,38,56,0.1); border-color:rgba(163,38,56,0.35); }
  .recap-pick-grey{ opacity:0.65; }
  .recap-pick-label{ font-family:'Space Mono',monospace; font-size:0.56rem; text-transform:uppercase; color:var(--ink-soft); letter-spacing:0.03em; }
  .recap-pick-value{ font-size:0.78rem; font-weight:700; color:var(--ink); }
  .qa-wrong{ background:rgba(163,38,56,0.08) !important; }
  .slot-pick-correct td{ font-weight:700; }
  .slot-pick-wrong{ background:rgba(163,38,56,0.1) !important; }
  .team-tag-mini{
    display:inline-block; font-family:'Space Mono',monospace; font-size:0.62rem; font-weight:700;
    background:var(--pitch); color:var(--chalk); padding:0.12rem 0.35rem; border-radius:5px; margin-right:0.4rem;
  }

  /* ===== v2 layout: slots rows + question tiles ===== */
  .v2-sechead{ font-family:'Space Mono',monospace; font-size:0.66rem; text-transform:uppercase; color:#B9C4BB; letter-spacing:0.04em; margin:1.2rem 0.2rem 0.6rem; }
  .v2-card{ background:var(--chalk); border-radius:14px; margin-bottom:0.7rem; overflow:hidden; box-shadow:0 14px 30px -20px rgba(0,0,0,0.5); }
  .v2-top{ display:grid; grid-template-columns:68px minmax(0,1fr) 58px; gap:0.6rem; align-items:center; padding:0.75rem 0.7rem 0.5rem; }
  .v2-nm{ font-weight:700; font-size:0.9rem; word-break:break-word; }
  .v2-nm small{ display:block; font-weight:500; font-size:0.68rem; color:var(--ink-soft); font-family:'Space Mono',monospace; }
  .v2-bars{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
  .v2-bar{ border-radius:7px; background:var(--chalk-dim); border:1px solid var(--line); text-align:center; padding:5px 1px 4px; }
  .v2-bar .s{ font-size:0.54rem; color:var(--ink-soft); line-height:1.1; min-height:1.3rem; display:flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; }
  .v2-bar .t{ font-size:0.72rem; font-weight:800; margin-top:2px; }
  .v2-bar.gold{ background:var(--gold); border-color:#8E7220; }
  .v2-bar.gold .s, .v2-bar.gold .t{ color:#2A2205; }
  .v2-sc{ text-align:right; font-family:'Space Mono',monospace; font-weight:800; font-size:1rem; color:var(--pitch); }
  .v2-sc small{ display:block; font-size:0.58rem; color:var(--ink-soft); font-weight:400; }
  .v2-xp{ display:block; width:100%; background:none; border:none; border-top:1px solid var(--line); padding:0.55rem; font-family:'Inter',sans-serif; font-size:0.78rem; font-weight:700; color:var(--pitch); cursor:pointer; }
  .v2-xp:hover{ background:var(--chalk-dim); }
  .v2-dt{ display:none; padding:0 0.7rem 0.7rem; overflow-x:auto; }
  .v2-card.open .v2-dt{ display:block; }
  .v2-dt table{ font-size:0.7rem; }
  .v2-dt th, .v2-dt td{ padding:0.45rem 0.3rem; white-space:normal; }
  .v2-dt .tag{ display:inline-block; font-size:0.62rem; padding:0.1rem 0.45rem; border-radius:999px; margin-left:0.35rem; font-weight:700; }
  .v2-dt .tag.y{ background:rgba(203,166,51,0.3); color:#5C4A0C; }
  .v2-dt .tag.n{ background:var(--chalk-dim); color:var(--ink-soft); }
  .v2-note{ font-size:0.66rem; color:var(--ink-soft); line-height:1.5; margin-top:0.5rem; white-space:normal; }
  .v2-fl{ display:flex; gap:0.45rem; flex-wrap:wrap; margin:0.2rem 0 0.8rem; }
  .v2-chip{ font-family:'Inter',sans-serif; font-size:0.74rem; padding:0.35rem 0.8rem; border-radius:999px; border:1px solid rgba(255,255,255,0.3); background:none; color:#B9C4BB; cursor:pointer; }
  .v2-chip.on{ background:var(--chalk); color:var(--pitch-dark); border-color:var(--chalk); font-weight:700; }
  .v2-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:0.55rem; }
  .v2-tile{ background:var(--chalk); border:2px solid transparent; border-radius:14px; padding:0.75rem; text-align:left; cursor:pointer; font-family:'Inter',sans-serif; color:var(--ink); display:block; width:100%; }
  .v2-tile.sel{ border-color:var(--gold); }
  .v2-tn{ display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem; gap:0.4rem; }
  .v2-qn{ font-family:'Space Mono',monospace; font-size:0.66rem; color:var(--ink-soft); font-weight:700; }
  .v2-pill{ font-size:0.62rem; font-weight:700; padding:0.15rem 0.55rem; border-radius:999px; white-space:nowrap; }
  .v2-pill.ok{ background:rgba(46,139,87,0.18); color:#1D6B3F; }
  .v2-pill.no{ background:rgba(163,38,56,0.14); color:#8A1F30; }
  .v2-pill.op{ background:rgba(203,166,51,0.28); color:#5C4A0C; }
  .v2-pill.dn{ background:var(--chalk-dim); color:var(--ink-soft); }
  .v2-tt{ font-size:0.84rem; font-weight:700; line-height:1.3; min-height:2.2rem; }
  .v2-live{ font-size:0.7rem; color:var(--ink-soft); margin:0.3rem 0 0.5rem; line-height:1.35; word-break:break-word; }
  .v2-rt{ border-top:1px solid var(--line); padding-top:0.5rem; }
  .v2-rt .l{ font-size:0.6rem; color:var(--ink-soft); font-family:'Space Mono',monospace; margin-bottom:0.35rem; }
  .v2-av{ display:flex; align-items:center; flex-wrap:wrap; }
  .v2-a{ width:24px; height:24px; border-radius:50%; background:var(--gold); color:#2A2205; font-size:0.56rem; font-weight:800; display:flex; align-items:center; justify-content:center; border:2px solid var(--chalk); margin-left:-6px; }
  .v2-a:first-child{ margin-left:0; }
  .v2-a.me{ background:var(--pitch); color:var(--chalk); }
  .v2-a.more{ background:var(--chalk-dim); color:var(--ink-soft); }
  .v2-none{ font-size:0.7rem; color:var(--ink-soft); }
  .v2-ft{ display:flex; justify-content:space-between; align-items:baseline; margin-top:0.55rem; padding-top:0.45rem; border-top:1px solid var(--line); font-size:0.64rem; color:var(--ink-soft); }
  .v2-ft b{ font-family:'Space Mono',monospace; font-size:0.95rem; color:var(--pitch); }
  .v2-ft b.z{ color:var(--ink-soft); font-weight:400; }
  .v2-panel{ background:var(--chalk); border-radius:14px; padding:0.9rem; margin-top:0.8rem; }
  .v2-panel h3{ margin:0 0 0.2rem; font-size:0.95rem; }
  .v2-panel .lbl{ font-size:0.74rem; color:var(--ink-soft); line-height:1.45; margin-bottom:0.2rem; }
  .v2-boxes{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:0.5rem; margin:0.7rem 0; }
  .v2-box{ background:var(--chalk-dim); border-radius:9px; padding:0.5rem 0.65rem; }
  .v2-box .k{ font-size:0.6rem; color:var(--ink-soft); font-family:'Space Mono',monospace; }
  .v2-box .v{ font-size:0.82rem; font-weight:700; margin-top:0.1rem; word-break:break-word; }
  .v2-msg{ font-size:0.8rem; line-height:1.5; padding:0.55rem 0.7rem; border-radius:9px; margin-bottom:0.4rem; }
  .v2-msg.ok{ background:rgba(46,139,87,0.14); }
  .v2-msg.no{ background:rgba(163,38,56,0.1); }
  .v2-msg.op, .v2-msg.dn{ background:var(--chalk-dim); }
  .v2-panel table{ margin-top:0.6rem; }
  .v2-panel tr.me td{ background:rgba(203,166,51,0.22); font-weight:700; }
  .v2-summary{ display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:0.8rem; }
  .v2-summary .v2-box{ background:var(--chalk); flex:1 1 140px; }
  @media(max-width:520px){ .v2-top{ grid-template-columns:50px minmax(0,1fr) 46px; gap:0.35rem; padding:0.65rem 0.45rem 0.4rem; } .v2-bar .s{ font-size:0.5rem; } .v2-bar .t{ font-size:0.66rem; } .v2-nm{ font-size:0.78rem; } }

  /* ===== v2 question rows ===== */
  .qr{ background:var(--chalk); border-radius:12px; margin-bottom:0.5rem; overflow:hidden; border-left:5px solid #888780; }
  .qr.l3{ border-left-color:#4C9A2A; } .qr.l2{ border-left-color:#97C459; } .qr.l1{ border-left-color:#EF9F27; } .qr.l0{ border-left-color:#D6453D; }
  .qr-h{ display:grid; grid-template-columns:30px minmax(0,1fr) auto; gap:0.6rem; align-items:start; padding:0.7rem 0.75rem; }
  .qr-n{ font-family:'Space Mono',monospace; font-size:0.68rem; font-weight:700; color:var(--ink-soft); padding-top:2px; }
  .qr-t{ font-size:0.86rem; font-weight:700; line-height:1.3; }
  #qStandings th, #qStandings td{ padding:0.5rem 0.3rem; } #qStandings th{ white-space:normal; line-height:1.2; vertical-align:bottom; } #qStandings td{ white-space:normal; } #qStandings .rank{ width:1.2rem; }
  .qr-w{ font-weight:500; color:var(--ink-soft); font-size:0.76rem; white-space:nowrap; }
  .qr-live{ font-size:0.72rem; color:var(--ink-soft); margin-top:2px; word-break:break-word; }
  .qr-mt{ display:flex; align-items:center; gap:0.5rem; margin-top:0.4rem; flex-wrap:wrap; }
  .qr-seg{ display:flex; gap:3px; }
  .qr-seg i{ width:15px; height:6px; border-radius:3px; background:var(--chalk-dim); border:1px solid var(--line); }
  .qr-seg i.f{ border:none; }
  .qr.l3 .qr-seg i.f{ background:#4C9A2A; } .qr.l2 .qr-seg i.f{ background:#97C459; } .qr.l1 .qr-seg i.f{ background:#EF9F27; } .qr.l0 .qr-seg i.f{ background:#D6453D; }
  .qr-lb{ font-size:0.66rem; font-weight:700; color:var(--ink-soft); }
  .qr-fx{ font-size:0.64rem; font-weight:700; padding:0.1rem 0.5rem; border-radius:999px; background:rgba(46,139,87,0.18); color:#1D6B3F; }
  .qr-pt{ text-align:right; font-family:'Space Mono',monospace; font-weight:800; font-size:1.05rem; color:var(--pitch); white-space:nowrap; }
  .qr-pt small{ display:block; font-size:0.56rem; font-weight:400; color:var(--ink-soft); }
  .qr-pt.z{ color:var(--ink-soft); font-weight:400; }
  .qr-nm{ margin-top:0.5rem; display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
  .qr-nm .h{ font-size:0.62rem; color:var(--ink-soft); margin-right:2px; font-family:'Space Mono',monospace; }
  .qr-p{ font-size:0.72rem; padding:0.12rem 0.55rem; border-radius:999px; background:var(--gold); color:#2A2205; font-weight:700; }
  .qr-p.me{ background:var(--pitch); color:var(--chalk); }
  .qr-p.x{ background:var(--chalk-dim); color:var(--ink-soft); font-weight:500; }
  .qr-p.x.me{ outline:2px solid var(--pitch); color:var(--pitch); }
  .qr-p.bad{ background:rgba(163,38,56,0.14); color:#8A1F30; font-weight:600; }
  .qr-p.bad.me{ outline:2px solid #8A1F30; }
  .qr-sl{ font-size:0.74rem; font-weight:700; color:var(--pitch); margin-top:3px; }
  .qr-yp{ font-size:0.72rem; color:var(--ink); margin-top:4px; line-height:1.6; }
  .qr.nom{ border-left-color:var(--line); }
  .qr.settled{ background:#E3EEE4; border-left-color:var(--pitch); }
  .qr-bd{ margin-bottom:0.3rem; }
  .qr-badge{ display:inline-block; font-family:'Space Mono',monospace; font-size:0.6rem; font-weight:700; letter-spacing:0.05em; padding:0.15rem 0.55rem; border-radius:5px; }
  .qr-badge.settled{ background:var(--pitch); color:var(--chalk); }
  .qr-badge.open{ background:rgba(203,166,51,0.3); color:#5C4A0C; }
  .qr-badge.none, .qr-badge.void{ background:var(--chalk-dim); color:var(--ink-soft); }
  .qr-p.hyp{ background:none; border:1px dashed var(--ink-soft); color:var(--ink); font-weight:600; }
  .qr-p.hyp.me{ border-style:solid; border-color:var(--pitch); background:rgba(15,61,44,0.08); }
  .qr-hyp{ border-top:1px dashed var(--line); padding-top:0.45rem; }
  .qr-hyp .h{ color:var(--pitch); font-weight:700; }
  .qr-xp{ display:block; width:100%; background:none; border:none; border-top:1px solid var(--line); padding:0.5rem; font-family:'Inter',sans-serif; font-size:0.74rem; font-weight:700; color:var(--pitch); cursor:pointer; }
  .qr-xp:hover{ background:var(--chalk-dim); }
  .qr-dt{ display:none; padding:0.7rem 0.75rem; border-top:1px solid var(--line); font-size:0.8rem; line-height:1.5; }
  .qr.open .qr-dt{ display:block; }
  .qr-dt .pts-on{ font-size:0.72rem; color:var(--ink-soft); margin-top:0.3rem; }
  .qr-dt table{ margin-top:0.6rem; }
  .qr-dt tr.me td{ background:rgba(203,166,51,0.22); font-weight:700; }
  .qr-dt td, .qr-dt th{ white-space:normal; }
  .qr-gh{ font-family:'Space Mono',monospace; font-size:0.66rem; text-transform:uppercase; color:#B9C4BB; letter-spacing:0.04em; margin:1.1rem 0.2rem 0.5rem; }
  .qr-key{ display:flex; gap:0.9rem; flex-wrap:wrap; font-size:0.68rem; color:#B9C4BB; margin:0.2rem 0.2rem 0.6rem; }
  .qr-key span{ display:flex; align-items:center; gap:5px; } .qr-key i{ width:10px; height:10px; border-radius:50%; display:inline-block; }
</style>
</head>
<body>
  <div class="header">
    <h1>PREM<span>iQ19</span> CASINO</h1>
    <p>Live Leaderboard</p>
    <p><a class="back-link" href="index.html">← Back to picks</a></p>
    <p><a href="admin.html" style="color:#6E7C74; font-family:'Space Mono',monospace; font-size:0.62rem; text-decoration:underline;">Admin</a></p>
  </div>

  <div class="wrap">
    <div id="leaderboardLockedNotice" style="display:none;" class="board">
      <div class="empty" style="padding:3rem 1.5rem;">
        <div style="font-size:2.2rem; margin-bottom:0.8rem;">🔒</div>
        <p style="font-size:1rem; font-weight:700; color:var(--ink); margin-bottom:0.5rem;">The leaderboard isn't open yet</p>
        <p style="font-size:0.85rem;">The organiser will open this up once the season begins. Check back soon!</p>
      </div>
    </div>

    <div id="leaderboardMainContent" style="display:none;">
    <div class="tab-bar">
      <button class="tab-btn active" id="tabLeaderboard">Leaderboard</button>
      <button class="tab-btn" id="tabSlots">Slots</button>
      <button class="tab-btn" id="tabRecap">Super Sunday Recap</button>
      <button class="tab-btn" id="tabBlackjack">Blackjack</button>
      <button class="tab-btn" id="tabQuestions">Questions</button>
    </div>

    <div id="leaderboardPanel"><div class="board"><div class="empty">Loading…</div></div></div>
    <div id="slotsPanel" style="display:none;"></div>
    <div id="recapPanel" style="display:none;"></div>
    <div id="blackjackPanel" style="display:none;"></div>
    <div id="questionsPanel" style="display:none;"></div>
    </div>
  </div>

<script>
  let sb = null;
  try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
  catch(err){ console.warn('Supabase not configured yet — running in preview mode.', err); }

  document.getElementById('tabLeaderboard').addEventListener('click', ()=>switchTab('leaderboard'));
  document.getElementById('tabSlots').addEventListener('click', ()=>switchTab('slots'));
  document.getElementById('tabRecap').addEventListener('click', ()=>switchTab('recap'));
  document.getElementById('tabBlackjack').addEventListener('click', ()=>switchTab('blackjack'));
  document.getElementById('tabQuestions').addEventListener('click', ()=>switchTab('questions'));

  function switchTab(tab){
    ['Leaderboard','Slots','Recap','Blackjack','Questions'].forEach(t=>{
      document.getElementById('tab'+t).classList.toggle('active', t.toLowerCase()===tab);
    });
    ['leaderboardPanel','slotsPanel','recapPanel','blackjackPanel','questionsPanel'].forEach(id=>{
      document.getElementById(id).style.display = id === tab+'Panel' ? 'block' : 'none';
    });
    if(tab==='leaderboard') renderLeaderboard();
    else if(tab==='slots') renderSlotsTab();
    else if(tab==='recap') renderRecapTab();
    else if(tab==='blackjack') renderBlackjackTab();
    else if(tab==='questions') renderQuestionsTab();
  }

  async function loadAll(){
    if(!sb) return null;
    const [{data:players},{data:picks},{data:answers},{data:questions},{data:teamStats},{data:h2hFixtures},{data:roulettePreds},{data:blackjackPicks},{data:settings}] = await Promise.all([
      sb.from('players').select('*'),
      sb.from('picks').select('*'),
      sb.from('answers').select('*'),
      sb.from('questions').select('*'),
      sb.from('team_stats').select('*'),
      sb.from('h2h_fixtures').select('*'),
      sb.from('roulette_predictions').select('*'),
      sb.from('blackjack_picks').select('*'),
      sb.from('settings').select('*'),
    ]);
    return {
      players:players||[], picks:picks||[], answers:answers||[], questions:questions||[], teamStats:teamStats||[],
      h2hFixtures:sortByMonth(h2hFixtures||[]), roulettePredictions:roulettePreds||[], blackjackPicks:blackjackPicks||[],
      settings:settings||[],
    };
  }

  function statsFor(teamStats, tag){ return teamStats.find(s=>s.team_tag===tag); }
  function slotOrder(slotId){ return SLOTS.findIndex(s=>s.id===slotId); }

  function buildRankedTable(teamStats){
    const list = teamStats.map(t => ({ ...t, gd: t.goals_for-t.goals_against, pts: t.wins*3+t.draws }));
    list.sort((a,b)=>{
      if(b.pts!==a.pts) return b.pts-a.pts;
      if(b.gd!==a.gd) return b.gd-a.gd;
      if(b.goals_for!==a.goals_for) return b.goals_for-a.goals_for;
      return a.team_name.localeCompare(b.team_name);
    });
    return list;
  }
  function currentPositionFor(rankedTable, tag){
    const idx = rankedTable.findIndex(t=>t.team_tag===tag);
    return idx===-1 ? null : idx+1;
  }

  function computeSlotsPoints(playerId, picks, teamStats){
    const myPicks = picks.filter(p=>p.player_id===playerId);
    const rankedTable = buildRankedTable(teamStats);
    let total = 0;
    myPicks.forEach(p=>{
      const stats = statsFor(teamStats, p.team_tag);
      const position = currentPositionFor(rankedTable, p.team_tag);
      total += pickScore(p, stats, position).points;
    });
    return total;
  }

  function computeQuestionsPoints(playerId, answers, questions){
    let total = 0;
    QUESTIONS.forEach(q=>{
      const dbQ = questions.find(x=>x.id===q.id);
      const correctAnswer = dbQ ? dbQ.correct_answer : null;
      const row = answers.find(a=>a.player_id===playerId && a.question_id===q.id);
      if(!row) return;
      let playerAnswer, allAnswers = null;
      if(q.type==='numeric-tiered' || q.type==='numeric-single'){
        playerAnswer = { playerId, value: (row.answer!=null && row.answer!=='') ? Number(row.answer) : null };
        allAnswers = answers.filter(a=>a.question_id===q.id).map(a=>({ playerId:a.player_id, value:(a.answer!=null && a.answer!=='') ? Number(a.answer) : null }));
      } else {
        playerAnswer = row.answer;
      }
      total += scoreAnswer(q, playerAnswer, correctAnswer, allAnswers).points;
    });
    return total;
  }

  function computeH2HPoints(playerId, roulettePredictions, h2hFixtures){
    let total = 0;
    const myRows = roulettePredictions.filter(r=>r.player_id===playerId);
    const months = [...new Set(myRows.map(r=>r.month))];
    months.forEach(month=>{
      const fixture = h2hFixtures.find(f=>f.month===month);
      const rowsForMonth = myRows.filter(r=>r.month===month);
      total += scoreRoulette(rowsForMonth, fixture).points;
    });
    return total;
  }

  function computeBlackjackPoints(playerId, blackjackPicks){
    const cards = blackjackPicks.filter(c=>c.player_id===playerId);
    return scoreBlackjack(cards).points;
  }

  // ============================================================
  // Tab 1: Leaderboard
  // ============================================================
  async function renderLeaderboard(){
    const panel = document.getElementById('leaderboardPanel');
    const data = await loadAll();
    if(!data){ panel.innerHTML = '<div class="board"><div class="empty">Preview mode — connect Supabase in config.js to see live standings.</div></div>'; return; }
    const { players, picks, answers, questions, teamStats, h2hFixtures, roulettePredictions, blackjackPicks, settings } = data;
    if(players.length===0){ panel.innerHTML = '<div class="board"><div class="empty">No entries yet — be the first to submit picks!</div></div>'; return; }

    const refreshSetting = settings.find(s=>s.key==='last_results_refresh');
    const refreshedLabel = refreshSetting && refreshSetting.value
      ? new Date(refreshSetting.value).toLocaleDateString('en-GB', { day:'2-digit', month:'2-digit', year:'2-digit' })
      : '—';

    const scored = players.map(p => {
      const slotsPts = computeSlotsPoints(p.id, picks, teamStats);
      const h2hPts = computeH2HPoints(p.id, roulettePredictions, h2hFixtures);
      const bjPts = computeBlackjackPoints(p.id, blackjackPicks);
      const questionsPts = computeQuestionsPoints(p.id, answers, questions);
      return { name:p.name, slotsPts, h2hPts, bjPts, questionsPts, total: slotsPts+h2hPts+bjPts+questionsPts };
    });
    scored.sort((a,b)=>b.total-a.total);

    const rows = scored.map((p,i)=>`
      <tr>
        <td class="rank">${i+1}</td>
        <td class="pname">${p.name}</td>
        <td class="num psub">${Math.round(p.slotsPts*100)/100}</td>
        <td class="num psub">${p.h2hPts}</td>
        <td class="num psub">${p.bjPts}</td>
        <td class="num psub">${p.questionsPts}</td>
        <td class="num ptotal">${Math.round(p.total*100)/100}</td>
      </tr>`).join('');

    panel.innerHTML = `
      <div class="board">
        <div class="legend-row"><span><b>Slots</b> = 7 slot picks</span><span><b>Super Sundays</b> = monthly predictions</span><span><b>Blackjack</b> = goals challenge</span><span><b>Questions</b> = 19 answers</span></div>
        <table>
          <tr>
            <th>#</th><th>Player</th>
            <th class="num">Slots<span class="th-sub">(refreshed at ${refreshedLabel})</span></th>
            <th class="num">Super Sundays</th>
            <th class="num">Blackjack</th>
            <th class="num">Questions</th>
            <th class="num">Total</th>
          </tr>
          ${rows}
        </table>
      </div>`;
  }

  // ============================================================
  // Tab 2: Slots — PL table / player picks / actual position mirror
  // ============================================================
  let slotsTabData = null;

  async function renderSlotsTab(){
    const panel = document.getElementById('slotsPanel');
    if(!sb){ panel.innerHTML = '<div class="board"><div class="empty">Preview mode — connect Supabase in config.js to see this.</div></div>'; return; }
    const [{data:teamStats},{data:players},{data:picks},{data:matchResults}] = await Promise.all([
      sb.from('team_stats').select('*'),
      sb.from('players').select('*'),
      sb.from('picks').select('*'),
      sb.from('match_results').select('*'),
    ]);
    slotsTabData = { teamStats: teamStats||[], players: players||[], picks: picks||[], matchResults: matchResults||[] };

    const list = slotsTabData.teamStats.map(t => ({ ...t, gd: t.goals_for-t.goals_against, pts: t.wins*3+t.draws }));
    list.sort((a,b)=>{
      if(b.pts!==a.pts) return b.pts-a.pts;
      if(b.gd!==a.gd) return b.gd-a.gd;
      if(b.goals_for!==a.goals_for) return b.goals_for-a.goals_for;
      return a.team_name.localeCompare(b.team_name);
    });
    slotsTabData.rankedTable = list;

    const playerOptions = slotsTabData.players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

    panel.innerHTML = `
      <div id="slotsGlance"></div>
      <div class="v2-sechead">Full table and pick-by-pick view</div>
      <select class="player-select" id="slotsPlayerSelect">
        <option value="">Select Player Name</option>
        ${playerOptions}
      </select>
      <div class="board">
        <div class="legend-row"><span>Full PL table (first-time-fixtures only). Select a player to see their 7 picks — gold + ✅ if currently on track for that slot, red + ❌ if not. Points include the multiplier once a pick is confirmed correct; flat 50 if it finishes wrong.</span></div>
        <div id="slotsUnifiedTableWrap"></div>
      </div>
      <div style="text-align:center; margin:1rem 0;">
        <button class="btn-results-toggle" id="matchResultsToggleBtn">📋 View Match Results</button>
      </div>
      <div class="board" id="matchResultsBoard" style="display:none;">
        <div class="legend-row">
          <span>See exactly which results have gone into the table above.</span>
        </div>
        <div style="padding:0.9rem 1rem;">
          <select class="player-select" id="matchweekSelect" style="margin-bottom:0.8rem;"></select>
          <div id="matchweekResultsWrap"></div>
        </div>
      </div>
    `;

    document.getElementById('slotsPlayerSelect').addEventListener('change', renderSlotsUnifiedTable);
    renderSlotsUnifiedTable();
    renderSlotsGlance();

    document.getElementById('matchResultsToggleBtn').addEventListener('click', ()=>{
      const board = document.getElementById('matchResultsBoard');
      const showing = board.style.display !== 'none';
      board.style.display = showing ? 'none' : 'block';
      if(!showing) renderMatchweekSelector();
    });
  }

  function renderMatchweekSelector(){
    const { matchResults } = slotsTabData;
    const weeks = [...new Set(matchResults.map(m=>m.matchweek))].sort((a,b)=>a-b);
    const select = document.getElementById('matchweekSelect');
    if(weeks.length===0){
      select.style.display = 'none';
      document.getElementById('matchweekResultsWrap').innerHTML = '<p class="psub" style="text-align:center; padding:1rem;">No results entered yet.</p>';
      return;
    }
    select.style.display = 'block';
    select.innerHTML = weeks.map(w => `<option value="${w}">Matchweek ${w}</option>`).join('');
    select.value = weeks[weeks.length-1];
    select.onchange = () => renderMatchweekResults(parseInt(select.value));
    renderMatchweekResults(parseInt(select.value));
  }

  function renderMatchweekResults(mw){
    const { matchResults } = slotsTabData;
    const games = matchResults.filter(m=>m.matchweek===mw);
    const rows = games.map(g => {
      const home = teamByTag(g.home_tag), away = teamByTag(g.away_tag);
      const played = g.home_score!=null && g.away_score!=null;
      return `<tr>
        <td class="pname">${home ? home.name : g.home_tag}</td>
        <td class="num ptotal">${played ? g.home_score : '—'}</td>
        <td class="psub" style="text-align:center;">v</td>
        <td class="num ptotal">${played ? g.away_score : '—'}</td>
        <td class="pname">${away ? away.name : g.away_tag}</td>
      </tr>`;
    }).join('');
    document.getElementById('matchweekResultsWrap').innerHTML = `
      <table>
        <tr><th>Home</th><th class="num">Score</th><th></th><th class="num">Score</th><th>Away</th></tr>
        ${rows || '<tr><td colspan="5" class="psub" style="text-align:center; padding:1rem;">No fixtures entered for this matchweek.</td></tr>'}
      </table>
    `;
  }

  const SLOT_SHORT = {'1st':'1st','2nd':'2nd','3-6':'3rd to 6th','7-12':'7th to 12th','13-18':'13th to 18th','19':'19th','20':'20th'};
  function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
  function r2(x){ return Math.round(x*100)/100; }

  function renderSlotsGlance(){
    const el = document.getElementById('slotsGlance');
    if(!el || !slotsTabData) return;
    const { players, picks, teamStats, rankedTable } = slotsTabData;
    if(!players.length){ el.innerHTML = ''; return; }
    const cards = players.map(pl=>{
      const mine = picks.filter(p=>p.player_id===pl.id);
      const rows = SLOTS.map(slot=>{
        const pick = mine.find(p=>p.slot===slot.id);
        if(!pick) return { slot, pick:null, res:null, on:false };
        const stats = statsFor(teamStats, pick.team_tag);
        const pos = currentPositionFor(rankedTable, pick.team_tag);
        const res = pickScore(pick, stats, pos);
        const on = res.status==='correct' || res.status==='provisional-correct';
        return { slot, pick, stats, pos, res, on };
      });
      const total = r2(rows.reduce((a,x)=>a+(x.res?x.res.points:0),0));
      return { pl, rows, total, ok: rows.filter(x=>x.on).length };
    }).sort((a,b)=> b.total-a.total || a.pl.name.localeCompare(b.pl.name));

    el.innerHTML = '<div class="v2-sechead">Everyone\'s slots. Gold means the pick is in its zone right now</div>' + cards.map(c=>{
      const bars = c.rows.map(x=>`<div class="v2-bar${x.on?' gold':''}"><div class="s">${SLOT_SHORT[x.slot.id]||x.slot.label}</div><div class="t">${x.pick?esc(x.pick.team_tag):'—'}</div></div>`).join('');
      const body = c.rows.map(x=>{
        if(!x.pick) return `<tr><td class="pname">${SLOT_SHORT[x.slot.id]}</td><td class="psub" colspan="6">No pick</td></tr>`;
        const t = teamByTag(x.pick.team_tag);
        const w = x.stats ? x.stats.wins : 0, gf = x.stats ? x.stats.goals_for : 0;
        const tag = x.on ? '<span class="tag y">in zone</span>' : `<span class="tag n">${x.pos?'now '+ordinal(x.pos):'no data'}</span>`;
        const pts = x.res ? r2(x.res.points) : 0;
        const ptsTxt = x.res && x.res.status==='wrong' ? pts+' (flat)' : pts;
        return `<tr><td class="pname">${SLOT_SHORT[x.slot.id]}</td><td>${esc(t?t.name:x.pick.team_tag)}${tag}</td><td class="num psub">${w}W, ${gf}G</td><td class="num psub">${w*3+gf*2}</td><td class="psub">x${x.slot.mult}</td><td class="num ptotal">${ptsTxt}</td></tr>`;
      }).join('');
      return `<div class="v2-card"><div class="v2-top"><div class="v2-nm">${esc(c.pl.name)}<small>${c.ok}/7</small></div><div class="v2-bars">${bars}</div><div class="v2-sc">${c.total}<small>pts</small></div></div>
        <div class="v2-dt"><table><tr><th>Slot</th><th>Pick</th><th class="num">Wins, goals</th><th class="num">Base</th><th>Mult</th><th class="num">Points</th></tr>${body}</table>
        <div class="v2-note">Base is wins x 3 plus goals x 2. A pick in its zone scores base x multiplier. A pick outside its zone scores 0 for now, and a flat 50 if it is still wrong when the season ends.</div></div>
        <button class="v2-xp" data-lbl="open">See full details</button></div>`;
    }).join('');
    el.querySelectorAll('.v2-xp').forEach(b=>b.addEventListener('click', ()=>{
      const card = b.parentNode, o = card.classList.toggle('open');
      b.textContent = o ? 'Hide details' : 'See full details';
    }));
  }

  function renderSlotsUnifiedTable(){
    const sel = document.getElementById('slotsPlayerSelect');
    const playerId = sel ? sel.value : '';
    const { teamStats, picks, rankedTable } = slotsTabData;
    const myPicks = playerId ? picks.filter(p=>p.player_id===playerId) : [];

    const rows = rankedTable.map((t,i) => {
      const position = i+1;
      const pick = myPicks.find(p=>p.team_tag===t.team_tag);
      let slotCell = '<td class="psub">—</td>';
      let resultCell = '<td class="psub">—</td>';
      let winPtsCell = '<td class="num psub">—</td>';
      let goalPtsCell = '<td class="num psub">—</td>';
      let baseTotalCell = '<td class="num psub">—</td>';
      let multCell = '<td class="psub">—</td>';
      let pointsCell = '<td class="num psub">—</td>';
      let rowClass = '';
      if(pick){
        const slot = SLOTS.find(s=>s.id===pick.slot);
        const correct = positionInSlot(position, pick.slot);
        const result = pickScore(pick, t, position);
        const winPts = t.wins*3, goalPts = t.goals_for*2;
        rowClass = correct ? 'slot-pick-correct' : 'slot-pick-wrong';
        slotCell = `<td class="pname">${slot?slot.label:pick.slot}</td>`;
        resultCell = `<td>${correct ? '✅' : '❌'}</td>`;
        winPtsCell = `<td class="num psub">${winPts}</td>`;
        goalPtsCell = `<td class="num psub">${goalPts}</td>`;
        baseTotalCell = `<td class="num psub">${winPts+goalPts}</td>`;
        multCell = `<td class="psub">${slot ? slot.mult+'x' : '—'}</td>`;
        pointsCell = `<td class="num ptotal">${Math.round(result.points*100)/100}</td>`;
      }
      return `<tr class="${rowClass}">
        <td class="rank">${position}</td>
        <td class="pname"><span class="team-tag-mini">${t.team_tag}</span>${t.team_name}</td>
        <td class="num psub">${t.matches_played}</td>
        <td class="num psub">${t.wins}</td>
        <td class="num psub">${t.goals_for}</td>
        <td class="num psub">${t.gd}</td>
        <td class="num psub">${t.pts}</td>
        ${slotCell}
        ${resultCell}
        ${winPtsCell}
        ${goalPtsCell}
        ${baseTotalCell}
        ${multCell}
        ${pointsCell}
      </tr>`;
    }).join('');

    document.getElementById('slotsUnifiedTableWrap').innerHTML = `
      <table>
        <tr><th>#</th><th>Team</th><th class="num">P</th><th class="num">W</th><th class="num">GF</th><th class="num">GD</th><th class="num">Pts</th><th>Your Slot</th><th>On Track?</th><th class="num">Win Pts</th><th class="num">Goal Pts</th><th class="num">Base Total</th><th>Mult.</th><th class="num">Points</th></tr>
        ${rows || '<tr><td colspan="13" class="psub" style="text-align:center; padding:1rem;">No results entered yet.</td></tr>'}
      </table>
    `;
  }

  // ============================================================
  // Tab 3: Super Sunday Recap
  // ============================================================
  async function renderRecapTab(){
    const panel = document.getElementById('recapPanel');
    if(!sb){ panel.innerHTML = '<div class="board"><div class="empty">Preview mode — connect Supabase in config.js to see this.</div></div>'; return; }
    const [{data:h2hFixturesRaw},{data:roulettePredictions},{data:players},{data:lockData}] = await Promise.all([
      sb.from('h2h_fixtures').select('*'),
      sb.from('roulette_predictions').select('*'),
      sb.from('players').select('*'),
      sb.from('settings').select('*').eq('key','roulette_open').maybeSingle(),
    ]);
    const rouletteOpen = lockData ? lockData.value === 'true' : false;

    if(rouletteOpen){
      panel.innerHTML = `
        <div class="board"><div class="empty" style="padding:3rem 1.5rem;">
          <div style="font-size:2.2rem; margin-bottom:0.8rem;">🔒</div>
          <p style="font-size:1rem; font-weight:700; color:var(--ink); margin-bottom:0.5rem;">Picks are kept secret while Monthly Super Sundays is open</p>
          <p style="font-size:0.85rem;">This stops anyone seeing what others have picked before the window closes. Once the organiser locks Monthly Super Sundays again, everyone's picks will show here.</p>
        </div></div>`;
      return;
    }

    const h2hFixtures = sortByMonth(h2hFixturesRaw || []);
    const playerName = id => { const p=(players||[]).find(x=>x.id===id); return p?p.name:'—'; };

    function fmtPrediction(cat, pred, fixture){
      const teamA = fixture.team_a ? teamByTag(fixture.team_a) : null;
      const teamB = fixture.team_b ? teamByTag(fixture.team_b) : null;
      if(!pred) return cat.group==='optional' ? 'Not Picked' : '—';
      if(cat.type==='threeway') return pred.value==='A' ? `${teamA?.name} win` : pred.value==='D' ? 'Draw' : pred.value==='B' ? `${teamB?.name} win` : '—';
      if(cat.type==='twoway') return pred.value==='A' ? (teamA?.name||'Team A') : pred.value==='B' ? (teamB?.name||'Team B') : '—';
      if(cat.type==='yesno') return pred.value==='yes' ? 'Yes' : pred.value==='no' ? 'No' : '—';
      if(cat.type==='scoreline') return (pred.scoreA!=null && pred.scoreA!=='' && pred.scoreB!=null && pred.scoreB!=='') ? `${pred.scoreA}-${pred.scoreB}` : '—';
      return '—';
    }

    // Green if correct, red if wrong, grey if not picked / not resolved yet /
    // handed-back (tied corners, neither carded — genuinely neutral, not wrong).
    function pickColorClass(cat, row, fixture){
      if(!row) return 'grey';
      if(!rouletteCategoryResolved(cat.id, fixture)) return 'grey';
      if(cat.id==='scoreline'){
        const p = row.prediction;
        const correct = p.scoreA!=null && p.scoreA!=='' && p.scoreB!=null && p.scoreB!==''
          && p.scoreA == fixture.score_a && p.scoreB == fixture.score_b;
        return correct ? 'green' : 'red';
      }
      if(cat.group==='tier'){
        const outcome = rouletteCategoryOutcome(cat.id, row.prediction, fixture);
        if(outcome==='handedback') return 'grey';
        return outcome ? 'green' : 'red';
      }
      if(cat.group==='optional'){
        const actual = cat.id==='redcard' ? fixture.redcard_actual : fixture.penalty_actual;
        if(actual==null) return 'grey';
        const correct = row.prediction.value === (actual ? 'yes' : 'no');
        return correct ? 'green' : 'red';
      }
      return 'grey';
    }

    const LINE1_CATS = ['result','btts','corners','shots','yellowcard','outsidebox'];
    const LINE2_CATS = ['scoreline','redcard','penalty'];

    const monthBlocks = (h2hFixtures||[]).map((f, idx)=>{
      if(!f.team_a || !f.team_b){
        return `<details class="month-collapse"><summary>${f.month} — fixture not added yet</summary></details>`;
      }

  function fmtAnswerForDisplay(q, row, correctAnswer, allAnswersRaw){
    const raw = row ? row.answer : null;
    if(raw==null || raw==='') return { text:'—', status:'unanswered', points:null };
    let text = '';
    if(q.type==='multi3' || q.type==='single1'){
      text = Array.isArray(raw) ? raw.map(t=>{ const tm=teamByTag(t); return tm?tm.name:t; }).join(', ') : String(raw);
    } else if(q.type==='yesno'){
      text = raw==='yes' ? 'Yes' : raw==='no' ? 'No' : String(raw);
    } else if(q.type==='teamselect'){
      const tm = teamByTag(raw); text = tm ? tm.name : raw;
    } else if(q.type==='numeric-tiered' || q.type==='numeric-single'){
      text = `${raw} ${q.unit||''}`.trim();
    } else {
      text = String(raw);
    }

    if(!correctAnswer) return { text, status:'pending', points:null };

    let playerAnswerForScoring, allAnswersForScoring = null;
    if(q.type==='numeric-tiered' || q.type==='numeric-single'){
      playerAnswerForScoring = { playerId: row.player_id, value: (raw!=null && raw!=='') ? Number(raw) : null };
      allAnswersForScoring = (allAnswersRaw||[]).filter(a=>a.question_id===q.id).map(a=>({ playerId:a.player_id, value: (a.answer!=null && a.answer!=='') ? Number(a.answer) : null }));
    } else {
      playerAnswerForScoring = raw;
    }
    const scored = scoreAnswer(q, playerAnswerForScoring, correctAnswer, allAnswersForScoring);
    if(scored.open && scored.points>0) return { text, status:'partial', points:scored.points };
    if(!scored.resolved) return { text, status:'pending', points:null, open: !!correctAnswer.open };
    return { text, status: scored.points>0 ? 'correct' : 'wrong', points: scored.points };
  }

  const Q_LV = ['Likely to flip','Could flip','Likely to hold','Locked in'];
  const Q_LV_SENTENCE = ['This is likely to change.','This could still change.','This is likely to hold.'];
  const qOpenSet = new Set();

  function maxPtsOf(q){
    if(typeof q.points==='number') return q.points;
    if(q.points && typeof q.points==='object') return Math.max(...Object.values(q.points));
    if(q.yesPoints!=null) return Math.max(q.yesPoints, q.noPoints);
    if(q.aPoints!=null) return Math.max(q.aPoints, q.bPoints);
    return 0;
  }
  function potentialFor(q, raw){
    if(raw==null || raw==='') return 0;
    if(q.type==='yesno') return q.yesPoints!=null ? (raw==='yes' ? q.yesPoints : q.noPoints) : q.points;
    if(q.type==='twochoice') return q.aPoints!=null ? (raw===q.optionA ? q.aPoints : q.bPoints) : q.points;
    if(q.type==='multi3') return q.points.p3;
    if(q.type==='numeric-tiered') return q.points.closest;
    return typeof q.points==='number' ? q.points : maxPtsOf(q);
  }
  function ptsLabel(q){
    if(q.type==='multi3') return [q.points.p1, q.points.p2, q.points.p3].join(' / ') + ' pts';
    if(q.type==='numeric-tiered') return `${q.points.closest} closest, ${q.points.nextNearest} next`;
    if(q.yesPoints!=null) return `Yes ${q.yesPoints}, No ${q.noPoints}`;
    if(q.aPoints!=null) return `${q.optionA} ${q.aPoints}, ${q.optionB} ${q.bPoints}`;
    return q.points + ' pts';
  }
  const tagName = t => { const x = teamByTag(t); return x ? x.name : t; };
  const spanC = (c, t, w) => `<span style="color:${c};${w?'font-weight:700;':''}">${t}</span>`;

  // Match result for team v opp from the team's point of view, or null if not played.
  function qResultFor(team, opp){
    const m = (questionsTabData.matchResults||[]).find(x=> (x.home_tag===team && x.away_tag===opp) || (x.home_tag===opp && x.away_tag===team));
    if(!m || m.home_score==null || m.away_score==null) return null;
    return m.home_tag===team ? { gf:m.home_score, ga:m.away_score } : { gf:m.away_score, ga:m.home_score };
  }

  function buildQuestionModels(){
    const { players, answers, questions, picks } = questionsTabData;
    return QUESTIONS.map(q=>{
      const dbQ = questions.find(x=>x.id===q.id);
      const ca = dbQ ? dbQ.correct_answer : null;
      const live = dbQ ? dbQ.live_update : null;
      const linked = !!q.slotLink;
      const need = q.type==='multi3' ? 2 : 1;
      const slotTeams = {};
      const per = players.map(pl=>{
        const row = answers.find(a=>a.player_id===pl.id && a.question_id===q.id);
        let r, ansHtml = null, pts, right, status;
        if(linked){
          const pk = picks.find(x=>x.player_id===pl.id && x.slot===q.slotLink);
          const team = pk ? pk.team_tag : null;
          slotTeams[pl.id] = team;
          const raw = (row && Array.isArray(row.answer)) ? row.answer : [];
          const officialOpps = (ca && Array.isArray(ca.opponents)) ? ca.opponents : null;
          const opps = (team && FIXTURES[team]) ? FIXTURES[team].map(x=>x[0]) : [];
          const auto = opps.filter(o=>{ const res=qResultFor(team,o); return res && (res.gf-res.ga)>=need; });
          const beatenList = officialOpps || auto;
          const eff = (ca && ca.void) ? ca : (officialOpps ? ca : { opponents:auto, open:true });
          const sc = scoreAnswer(q, raw, eff, null);
          pts = sc.points||0; right = pts>0;
          status = !row ? 'unanswered' : (right ? 'partial' : 'pending');
          const parts = raw.map(o=>{
            const res = team ? qResultFor(team,o) : null;
            const score = res ? ` ${res.gf}-${res.ga}` : '';
            if(beatenList.includes(o) || (res && (res.gf-res.ga)>=need)) return spanC('#1D6B3F', `${o}${score} ✓`, true);
            if(res) return spanC('#8A1F30', `${o}${score} ✗`);
            return spanC('var(--ink-soft)', `${o} (not yet played)`);
          });
          ansHtml = parts.length ? parts.join(', ') : '—';
          r = { text: raw.join(', ') || '—' };
        } else {
          r = fmtAnswerForDisplay(q, row, ca, answers);
          status = r.status; pts = r.points||0; right = (status==='correct' || status==='partial');
          ansHtml = esc(r.text);
        }
        const pot = Math.max(pts, potentialFor(q, row ? row.answer : null));
        return { pl, text:r.text, ansHtml, status, points:pts, right, pot, gain: Math.max(0, pot-pts), team: linked ? slotTeams[pl.id] : null, raw: row ? row.answer : null };
      });
      let kind;
      if(ca && ca.void) kind = 'void';
      else if(linked) kind = (ca && Array.isArray(ca.opponents) && !ca.open) ? 'settled' : 'open';
      else if(!ca) kind = 'none';
      else if(ca.open) kind = 'open';
      else kind = per.some(p=>p.status==='pending') ? 'open' : 'settled';
      let hyp = null;
      if(kind==='open' && !linked && ca){
        if((q.type==='numeric-tiered' || q.type==='numeric-single') && ca.actualValue!=null){
          const target = Number(ca.actualValue);
          const ans = per.filter(p=>p.raw!=null && p.raw!=='' && !isNaN(Number(p.raw))).map(p=>({ p, diff:Math.abs(Number(p.raw)-target) }));
          const diffs = [...new Set(ans.map(a=>a.diff))].sort((a,b)=>a-b);
          const nRanks = q.type==='numeric-tiered' ? 2 : 1;
          const items = [];
          diffs.slice(0,nRanks).forEach((d,i)=>{
            const pts = q.type==='numeric-tiered' ? (i===0 ? q.points.closest : q.points.nextNearest) : q.points;
            ans.filter(a=>a.diff===d).forEach(a=>items.push({ pl:a.p.pl, rank:i+1, pts, diff:d }));
          });
          hyp = { kind:'rank', target, unit:q.unit||'', items, others: ans.length-items.length };
        } else if((q.type==='yesno' || q.type==='twochoice') && (ca.hypothetical!=null || ca.value!=null)){
          const fromHyp = ca.hypothetical!=null;
          let other;
          if(fromHyp) other = ca.hypothetical;
          else other = q.type==='yesno' ? (ca.value==='yes' ? 'no' : 'yes') : (ca.value===q.optionA ? q.optionB : q.optionA);
          const pts = q.type==='yesno' ? (q.yesPoints!=null ? (other==='yes' ? q.yesPoints : q.noPoints) : q.points)
                                       : (q.aPoints!=null ? (other===q.optionA ? q.aPoints : q.bPoints) : q.points);
          const label = q.type==='yesno' ? (other==='yes' ? 'YES' : 'NO') : String(other).toUpperCase();
          hyp = { kind:'flip', label, fromHyp, items: per.filter(p=>p.raw===other).map(p=>({ pl:p.pl, pts })) };
        }
      }
      let flip = null;
      if(kind==='open' && !linked && ca && ca.value!=null && (q.type==='yesno' || q.type==='twochoice')){
        let other, pts, label;
        if(q.type==='yesno'){ other = ca.value==='yes' ? 'no' : 'yes'; label = other==='yes' ? 'Yes' : 'No'; pts = q.yesPoints!=null ? (other==='yes' ? q.yesPoints : q.noPoints) : q.points; }
        else { other = ca.value===q.optionA ? q.optionB : q.optionA; label = String(other); pts = q.aPoints!=null ? (other===q.optionA ? q.aPoints : q.bPoints) : q.points; }
        flip = { label, gain: per.filter(p=>p.raw===other).map(p=>({ pl:p.pl, pts })), drop: per.filter(p=>p.right).map(p=>p.pl) };
      }
      let lv = null;
      if(kind==='settled') lv = 3;
      else if(kind==='open') lv = (linked || !(q.type==='yesno' || q.type==='twochoice')) ? 3 : ((ca && ca.likelihood!=null) ? Math.max(0, Math.min(2, Number(ca.likelihood))) : 1);
      let slotLine = null;
      if(linked){
        const teams = [...new Set(Object.values(slotTeams).filter(Boolean))];
        const lbl = (SLOTS.find(x=>x.id===q.slotLink)||{}).label || q.slotLink;
        const nice = lbl.toLowerCase().replace('1st','1st').replace(/^(\d+)(st|nd|rd|th)$/,'$1$2');
        slotLine = teams.length===1 ? `Slot ${nice} team everyone picked: ${tagName(teams[0])}`
          : teams.length>1 ? `Slot ${nice} teams differ by player: ${teams.map(tagName).join(', ')}` : null;
      }
      return { q, ca, live, per, kind, lv, linked, slotLine, hyp, flip, right: per.filter(p=>p.right) };
    });
  }

  function renderQuestionsPlayerAnswers(){
    if(!questionsTabData) return;
    const youId = document.getElementById('questionsPlayerSelect').value;
    const models = buildQuestionModels();
    const nPlayers = questionsTabData.players.length;
    const mineOf = m => youId ? m.per.find(p=>p.pl.id===youId) : null;

    // ---- summary table: points now / if the game ended today / likely outcome
    (function(){
      const rows = questionsTabData.players.map(pl=>{
        let now = 0, today = 0, likely = 0;
        models.forEach(m=>{
          const x = m.per.find(p=>p.pl.id===pl.id);
          const cur = x ? x.points : 0;
          now += cur;
          // if the game ended today: swap in the what-if answers set in admin
          if(m.hyp && m.hyp.kind==='flip' && m.hyp.fromHyp && m.kind==='open'){
            const it = m.hyp.items.find(i=>i.pl.id===pl.id);
            today += it ? it.pts : 0;
          } else today += cur;
          // likely outcome: only "Likely to flip" open questions change; everything else stays as it is
          if(m.kind==='open' && !m.linked && m.lv===0){
            if(m.flip){ const g = m.flip.gain.find(i=>i.pl.id===pl.id); likely += g ? g.pts : 0; }
            else if(m.hyp && m.hyp.kind==='flip'){ const it = m.hyp.items.find(i=>i.pl.id===pl.id); likely += it ? it.pts : 0; }
            else likely += cur;
          } else likely += cur;
        });
        return { pl, now, today, likely };
      });
      const rank = (key)=>{
        const o = rows.slice().sort((x,y)=> y[key]-x[key] || x.pl.name.localeCompare(y.pl.name));
        o.forEach((r,i)=>{ r['r_'+key] = (i>0 && o[i-1][key]===r[key]) ? o[i-1]['r_'+key] : i+1; });
      };
      rank('now'); rank('today'); rank('likely');
      const order = rows.slice().sort((x,y)=> y.likely-x.likely || y.now-x.now || x.pl.name.localeCompare(y.pl.name));
      const nHyp = models.filter(m=>m.hyp && m.hyp.kind==='flip' && m.hyp.fromHyp && m.kind==='open').length;
      const nFlip = models.filter(m=>m.kind==='open' && !m.linked && m.lv===0).length;
      document.getElementById('qStandingsNote').textContent = `${nHyp} what-if, ${nFlip} likely to flip`;
      const flips = models.filter(m=>m.flip).sort((x,y)=>x.lv-y.lv);
      const nm = (list) => list.length ? list.map(x=>{ const pl = x.pl||x; return `<span class="qr-p${pl.id===youId?' me':''}">${esc(pl.name)}${x.pts?' +'+x.pts:''}</span>`; }).join('') : '<span class="qr-p x">Nobody</span>';
      const flipHtml = flips.length ? `<div style="padding:0 0.9rem 0.9rem;"><div class="qr-gh" style="color:var(--ink-soft);margin:0.2rem 0 0.4rem;">WHAT COULD FLIP</div>${flips.map(m=>`<div style="border-top:1px solid var(--line); padding:0.55rem 0;"><div style="font-size:0.8rem; font-weight:700;">Q${m.q.id}: ${esc(m.q.short)} <span class="qr-lb">(${Q_LV[m.lv]})</span></div><div class="qr-nm"><span class="h">IF IT FLIPS TO ${esc(m.flip.label.toUpperCase())}, THESE GAIN</span>${nm(m.flip.gain)}</div><div class="qr-nm"><span class="h">THESE DROP OUT</span>${nm(m.flip.drop)}</div></div>`).join('')}</div>` : '';
      const cell = (v, r, strong) => `<td class="num ${strong?'ptotal':'psub'}">${v}</td>`;
      const body = order.map((r,i)=>`<tr class="${r.pl.id===youId?'slot-pick-correct':''}"><td class="rank">${r.r_likely}</td><td class="pname">${esc(r.pl.name)}${r.pl.id===youId?' (you)':''}</td>${cell(r.now,r.r_now,false)}${cell(r.today,r.r_today,false)}${cell(r.likely,r.r_likely,true)}</tr>`).join('');
      document.getElementById('qStandings').innerHTML = `<div style="overflow-x:auto;"><table><tr><th>#</th><th>Player</th><th class="num">Points now</th><th class="num">If game ended today</th><th class="num">Likely outcome</th></tr>${body}</table></div>
        ${flipHtml}`;
    })();

    const sumEl = document.getElementById('qSummary');
    if(youId){
      let now=0, safe=0, chg=0;
      models.forEach(m=>{ const x=mineOf(m); if(!x) return;
        now += x.points;
        if(m.kind==='settled') safe += x.points;
        else if(m.kind==='open'){ if(m.lv>=2) safe += x.points; else chg += x.points; } });
      sumEl.innerHTML = `<div class="v2-summary">
        <div class="v2-box"><div class="k">Points now</div><div class="v">${now}</div></div>
        <div class="v2-box"><div class="k">Safe or likely to hold</div><div class="v">${safe}</div></div>
        <div class="v2-box"><div class="k">Could change</div><div class="v">${chg}</div></div></div>`;
    } else sumEl.innerHTML = '';

    if(qFilter==='up') qFilter = 'all';
    const filters = [['all','All'],['risk','Could change']];
    filters.push(['safe','Locked or likely']);
    document.getElementById('qFilters').innerHTML = filters.map(f=>`<button class="v2-chip${qFilter===f[0]?' on':''}" data-f="${f[0]}">${f[1]}</button>`).join('');

    const keep = m=>{
      if(qFilter==='risk') return m.kind==='open' && m.lv<=1;
      if(qFilter==='safe') return m.lv!=null && m.lv>=2;
      return true;
    };

    let out = '';
    models.filter(keep).forEach(m=>{
      const q = m.q, mine = mineOf(m);
      const showMeter = m.lv!=null && !m.linked && m.kind==='open' && (m.q.type==='yesno' || m.q.type==='twochoice');
      const segs = showMeter ? [0,1,2,3].map(i=>`<i class="${i<=m.lv?'f':''}"></i>`).join('') : '';
      const meter = showMeter ? `<span class="qr-seg">${segs}</span><span class="qr-lb">${Q_LV[m.lv]}</span>` : '';
      const fx = '';
      const liveTxt = m.live ? esc(m.live) : (m.kind==='settled' ? 'Settled' : m.kind==='none' ? 'Not marked yet' : m.kind==='void' ? 'Voided, nobody scores' : '');
      const showPts = typeof q.points==='object' || q.yesPoints!=null || q.aPoints!=null;
      const byPts = (a,b)=> b.points-a.points || a.pl.name.localeCompare(b.pl.name);
      const scoring = m.per.filter(p=>p.right).sort((a,b)=> (a.pl.id===youId?-1:b.pl.id===youId?1:0) || byPts(a,b));
      const notScoring = m.per.filter(p=>!p.right).sort((a,b)=> (a.pl.id===youId?-1:b.pl.id===youId?1:0) || a.pl.name.localeCompare(b.pl.name));
      const chipTxt = p => esc(p.pl.name) + ((showPts || m.linked) ? ` ${p.points}` : '');
      const goodChips = scoring.length ? scoring.map(p=>`<span class="qr-p${p.pl.id===youId?' me':''}">${chipTxt(p)}</span>`).join('') : '<span class="qr-p x">Nobody yet</span>';
      const badCls = m.kind==='settled' ? 'bad' : 'x';
      const badChips = notScoring.length ? notScoring.map(p=>`<span class="qr-p ${badCls}${p.pl.id===youId?' me':''}">${chipTxt(p)}</span>`).join('') : '<span class="qr-p x">Nobody</span>';
      const nameLines = (m.kind==='open'||m.kind==='settled')
        ? `<div class="qr-nm"><span class="h">${m.kind==='open'?'SCORING NOW':'SCORED'}</span>${goodChips}</div><div class="qr-nm"><span class="h">${m.kind==='open'?'NOT SCORING YET':'DID NOT SCORE'}</span>${badChips}</div>` : '';
      let hypHtml = '';
      if(m.hyp){
        const me = id => id===youId ? ' me' : '';
        if(m.hyp.kind==='rank'){
          const ch = m.hyp.items.map(i=>`<span class="qr-p${me(i.pl.id)}">${ordinal(i.rank)} ${esc(i.pl.name)} (${i.diff===0?'spot on':i.diff+' away'}) +${i.pts}</span>`).join('') || '<span class="qr-p x">No guesses</span>';
          hypHtml = `<div class="qr-nm qr-hyp"><span class="h">CLOSEST TO ${esc(String(m.hyp.target))} ${esc(m.hyp.unit.toUpperCase())} SO FAR</span>${ch}${m.hyp.others>0?`<span class="v2-none">+${m.hyp.others} further away</span>`:''}</div>`;
        } else {
          const ch = m.hyp.items.length ? m.hyp.items.map(i=>`<span class="qr-p hyp${me(i.pl.id)}">${esc(i.pl.name)} +${i.pts}</span>`).join('') : '<span class="qr-p x">Nobody</span>';
          hypHtml = `<div class="qr-nm qr-hyp"><span class="h">HYPOTHETICAL: WHO SCORES IF IT ${m.hyp.fromHyp?'ENDS':'FLIPS TO'} ${esc(m.hyp.label)}</span>${ch}</div>`;
        }
      }
      const badge = m.kind==='settled' ? '<span class="qr-badge settled">✓ SETTLED</span>' : m.kind==='open' ? '<span class="qr-badge open">STILL OPEN</span>' : m.kind==='void' ? '<span class="qr-badge void">VOID</span>' : '<span class="qr-badge none">NOT MARKED YET</span>';
      const closestTag = (q.type==='numeric-tiered' || q.type==='numeric-single') ? ' <span class="qr-badge none">CLOSEST TO WINS</span>' : '';
      let ptCol;
      if(youId && mine) ptCol = `<div class="qr-pt${mine.points?'':' z'}">${mine.points?'+'+mine.points:'0'}<small>${m.kind==='open' ? 'now, of '+mine.pot : m.kind==='settled' ? 'final' : ''}</small></div>`;
      else ptCol = '<div></div>';

      let why;
      if(m.kind==='void') why = 'This question was voided, so nobody scores on it.';
      else if(m.kind==='none') why = 'Not marked yet, so no points are on the board for this one.';
      else if(m.kind==='open') why = mine
        ? (mine.status==='unanswered' ? 'You did not answer this one.'
          : m.linked ? (mine.right ? `You have ${mine.points} pts so far. Points can only go up as more games are played.` : 'No points yet. Points can only go up as more games are played.')
          : mine.right ? `You are matching so far and scoring ${mine.points} pts. ${Q_LV_SENTENCE[m.lv]}`
          : `You are not matching right now. ${Q_LV_SENTENCE[m.lv]}`)
        : (m.linked ? 'Points can only go up as more games are played.' : Q_LV_SENTENCE[m.lv]);
      else why = mine
        ? (mine.status==='unanswered' ? 'You did not answer this one.' : mine.right ? `Settled. You scored ${mine.points} pts.` : 'Settled. Your answer did not score.')
        : 'Settled.';

      const trs = m.per.slice().sort((a,b)=> b.points-a.points || (a.pl.id===youId?-1:b.pl.id===youId?1:0) || a.pl.name.localeCompare(b.pl.name)).map(p=>{
        const t = p.status==='unanswered' ? '—' : p.right ? '+'+p.points : (m.kind==='open' ? '0 so far' : '0');
        const teamCell = m.linked ? `<td class="psub">${esc(p.team?tagName(p.team):'—')}</td>` : '';
        return `<tr class="${p.pl.id===youId?'me':''}"><td class="pname">${esc(p.pl.name)}${p.pl.id===youId?' (you)':''}</td>${teamCell}<td class="psub" style="white-space:normal;">${p.ansHtml}</td><td class="num ${p.right?'ptotal':'psub'}">${t}</td></tr>`;
      }).join('');
      const slotHtml = m.slotLine ? `<div class="qr-sl">${esc(m.slotLine)}</div>` : '';
      const yourPicks = (m.linked && mine) ? `<div class="qr-yp"><b>Your picks:</b> ${mine.ansHtml}</div>` : '';
      const lvClass = m.kind==='settled' ? ' settled' : ((m.lv!=null && !m.linked && (m.q.type==='yesno' || m.q.type==='twochoice')) ? ' l'+m.lv : ' nom');
      const isOpen = qOpenSet.has(q.id);
      out += `<div class="qr${lvClass}${isOpen?' open':''}" data-q="${q.id}">
        <div class="qr-h"><span class="qr-n">Q${q.id}</span><div><div class="qr-bd">${badge}${closestTag}</div><div class="qr-t">${esc(q.short)} <span class="qr-w">(${esc(ptsLabel(q))})</span></div>${slotHtml}${liveTxt?`<div class="qr-live">${liveTxt}</div>`:''}${yourPicks}${(meter||fx)?`<div class="qr-mt">${meter}${fx}</div>`:''}${nameLines}${hypHtml}</div>${ptCol}</div>
        <div class="qr-dt"><div>${why}</div><div class="pts-on">Points on offer: ${esc(q.pointsText||'')}</div><div style="overflow-x:auto;"><table><tr><th>Player</th>${m.linked?'<th>Slot team</th>':''}<th>${m.linked?'Picks':'Answer'}</th><th class="num">Points${m.kind==='open'?' now':''}</th></tr>${trs}</table></div></div>
        <button class="qr-xp">${isOpen?'Hide details':'See full details'}</button></div>`;
    });
    const grid = document.getElementById('qGrid');
    grid.innerHTML = out || '<div class="v2-none" style="color:#B9C4BB;">Nothing here.</div>';

    document.querySelectorAll('#qFilters .v2-chip').forEach(b=>b.addEventListener('click', ()=>{ qFilter=b.dataset.f; renderQuestionsPlayerAnswers(); }));
    grid.querySelectorAll('.qr-xp').forEach(b=>b.addEventListener('click', ()=>{
      const row = b.parentNode, id = Number(row.dataset.q), o = row.classList.toggle('open');
      if(o) qOpenSet.add(id); else qOpenSet.delete(id);
      b.textContent = o ? 'Hide details' : 'See full details';
    }));
  }

  async function initLeaderboard(){
    if(!sb){
      document.getElementById('leaderboardMainContent').style.display = 'block';
      renderLeaderboard();
      return;
    }
    const { data } = await sb.from('settings').select('*').eq('key','leaderboard_open').maybeSingle();
    const isOpen = data ? data.value === 'true' : false;
    if(!isOpen){
      document.getElementById('leaderboardLockedNotice').style.display = 'block';
      return;
    }
    document.getElementById('leaderboardMainContent').style.display = 'block';
    renderLeaderboard();
    setInterval(()=>{ document.getElementById('tabLeaderboard').classList.contains('active') && renderLeaderboard(); }, 30000);
  }
  initLeaderboard();
</script>
</body>
</html>
