<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PREMiQ19 Casino — Leaderboard</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PremIQ19">
<meta name="theme-color" content="#0F3D2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="questions-data.js"></script>
<style>
  :root{ --pitch-dark:#0B2E22; --pitch:#0F3D2C; --chalk:#F6F5EF; --chalk-dim:#EAE7DB; --ink:#122019; --ink-soft:#5C6B62; --line:#DCD8C9; --gold:#CBA633; }
  *{box-sizing:border-box;}
  body{ margin:0; background:radial-gradient(1200px 600px at 15% -10%, rgba(255,255,255,0.05), transparent 60%), var(--pitch-dark); font-family:'Inter',sans-serif; color:var(--ink); min-height:100vh; }
  .header{ background:linear-gradient(180deg, var(--pitch) 0%, var(--pitch-dark) 100%); padding:1.6rem 1rem 1.2rem; text-align:center; border-bottom:3px solid rgba(203,166,51,0.5); }
  .header h1{ font-family:'Bebas Neue',sans-serif; font-size:clamp(1.8rem,7vw,3rem); color:var(--chalk); margin:0; }
  .header h1 span{ color:var(--gold); }
  .header p{ color:#B9C4BB; font-size:0.78rem; margin:0.5rem 0 0; }
  a.back-link{ color:var(--gold); font-family:'Space Mono',monospace; font-size:0.7rem; text-decoration:underline; }
  .wrap{ max-width:1100px; margin:0 auto; padding:1.2rem 0.8rem 3rem; }

  .tab-bar{ display:flex; gap:1.1rem; margin-bottom:1rem; border-bottom:1.5px solid rgba(255,255,255,0.18); padding:0 0.2rem; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .tab-bar::-webkit-scrollbar{ display:none; }
  .tab-btn{ flex-shrink:0; }
  .tab-btn{ font-family:'Bebas Neue',sans-serif; font-size:1.05rem; letter-spacing:0.02em; background:none; border:none; border-bottom:3px solid transparent; color:#B9C4BB; padding:0.5rem 0.1rem; cursor:pointer; }
  .tab-btn.active{ color:var(--chalk); border-bottom-color:var(--gold); }

  .board{ background:var(--chalk); border-radius:16px; overflow-x:auto; overflow-y:hidden; box-shadow:0 20px 40px -20px rgba(0,0,0,0.4); -webkit-overflow-scrolling:touch; }
  .board table{ min-width:100%; }
  .empty{ text-align:center; padding:2rem; color:var(--ink-soft); font-size:0.85rem; }

  table{ width:100%; border-collapse:collapse; font-size:0.8rem; }
  th, td{ text-align:left; padding:0.55rem 0.6rem; border-bottom:1px solid var(--line); white-space:nowrap; }
  th{ font-family:'Space Mono',monospace; font-size:0.62rem; text-transform:uppercase; color:var(--ink-soft); }
  th.num, td.num{ text-align:right; }
  th .th-sub{ display:block; text-transform:none; font-size:0.6rem; color:var(--ink-soft); font-weight:400; margin-top:0.15rem; }

  .rank{ font-family:'Bebas Neue',sans-serif; font-size:1.15rem; color:var(--ink-soft); width:1.6rem; }
  tr:nth-child(1) .rank{ color:#CBA633; } tr:nth-child(2) .rank{ color:#8C9199; } tr:nth-child(3) .rank{ color:#B08050; }
  .pname{ font-weight:700; }
  .ptotal{ font-family:'Space Mono',monospace; font-weight:800; color:var(--pitch); }
  .psub{ font-family:'Space Mono',monospace; color:var(--ink-soft); }

  .legend-row{ display:flex; gap:1rem; padding:0.7rem 1rem; font-size:0.68rem; color:var(--ink-soft); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .legend-row span b{ color:var(--ink); }

  .player-select{
    width:100%; padding:0.6rem 0.7rem; border:1.5px solid var(--line); border-radius:9px; font-size:0.85rem;
    margin-bottom:0.8rem; font-family:'Inter',sans-serif; background:#fff;
  }

  .slot-pick-correct{ background:rgba(203,166,51,0.22) !important; }
  .slot-pick-correct td{ font-weight:700; }
  .slot-pick-wrong{ background:rgba(163,38,56,0.1) !important; }
  .team-tag-mini{
    display:inline-block; font-family:'Space Mono',monospace; font-size:0.62rem; font-weight:700;
    background:var(--pitch); color:var(--chalk); padding:0.12rem 0.35rem; border-radius:5px; margin-right:0.4rem;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>PREM<span>iQ19</span> CASINO</h1>
    <p>Live Leaderboard</p>
    <p><a class="back-link" href="index.html">← Back to picks</a></p>
    <p><a href="admin.html" style="color:#6E7C74; font-family:'Space Mono',monospace; font-size:0.62rem; text-decoration:underline;">Admin</a></p>
  </div>

  <div class="wrap">
    <div class="tab-bar">
      <button class="tab-btn active" id="tabLeaderboard">Leaderboard</button>
      <button class="tab-btn" id="tabSlots">Slots</button>
      <button class="tab-btn" id="tabRecap">Super Sunday Recap</button>
      <button class="tab-btn" id="tabBlackjack">Blackjack</button>
      <button class="tab-btn" id="tabQuestions">Questions</button>
    </div>

    <div id="leaderboardPanel"><div class="board"><div class="empty">Loading…</div></div></div>
    <div id="slotsPanel" style="display:none;"></div>
    <div id="recapPanel" style="display:none;"></div>
    <div id="blackjackPanel" style="display:none;"></div>
    <div id="questionsPanel" style="display:none;"></div>
  </div>

<script>
  let sb = null;
  try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
  catch(err){ console.warn('Supabase not configured yet — running in preview mode.', err); }

  document.getElementById('tabLeaderboard').addEventListener('click', ()=>switchTab('leaderboard'));
  document.getElementById('tabSlots').addEventListener('click', ()=>switchTab('slots'));
  document.getElementById('tabRecap').addEventListener('click', ()=>switchTab('recap'));
  document.getElementById('tabBlackjack').addEventListener('click', ()=>switchTab('blackjack'));
  document.getElementById('tabQuestions').addEventListener('click', ()=>switchTab('questions'));

  function switchTab(tab){
    ['Leaderboard','Slots','Recap','Blackjack','Questions'].forEach(t=>{
      document.getElementById('tab'+t).classList.toggle('active', t.toLowerCase()===tab);
    });
    ['leaderboardPanel','slotsPanel','recapPanel','blackjackPanel','questionsPanel'].forEach(id=>{
      document.getElementById(id).style.display = id === tab+'Panel' ? 'block' : 'none';
    });
    if(tab==='leaderboard') renderLeaderboard();
    else if(tab==='slots') renderSlotsTab();
    else if(tab==='recap') renderRecapTab();
    else if(tab==='blackjack') renderBlackjackTab();
    else if(tab==='questions') renderQuestionsTab();
  }

  async function loadAll(){
    if(!sb) return null;
    const [{data:players},{data:picks},{data:answers},{data:questions},{data:teamStats},{data:h2hFixtures},{data:roulettePreds},{data:blackjackPicks},{data:settings}] = await Promise.all([
      sb.from('players').select('*'),
      sb.from('picks').select('*'),
      sb.from('answers').select('*'),
      sb.from('questions').select('*'),
      sb.from('team_stats').select('*'),
      sb.from('h2h_fixtures').select('*'),
      sb.from('roulette_predictions').select('*'),
      sb.from('blackjack_picks').select('*'),
      sb.from('settings').select('*'),
    ]);
    return {
      players:players||[], picks:picks||[], answers:answers||[], questions:questions||[], teamStats:teamStats||[],
      h2hFixtures:sortByMonth(h2hFixtures||[]), roulettePredictions:roulettePreds||[], blackjackPicks:blackjackPicks||[],
      settings:settings||[],
    };
  }

  function statsFor(teamStats, tag){ return teamStats.find(s=>s.team_tag===tag); }
  function slotOrder(slotId){ return SLOTS.findIndex(s=>s.id===slotId); }

  function computeSlotsPoints(playerId, picks, teamStats){
    const myPicks = picks.filter(p=>p.player_id===playerId);
    let total = 0;
    myPicks.forEach(p=>{
      const stats = statsFor(teamStats, p.team_tag);
      total += pickScore(p, stats).points;
    });
    return total;
  }

  function computeQuestionsPoints(playerId, answers, questions){
    let total = 0;
    QUESTIONS.forEach(q=>{
      const dbQ = questions.find(x=>x.id===q.id);
      const correctAnswer = dbQ ? dbQ.correct_answer : null;
      const row = answers.find(a=>a.player_id===playerId && a.question_id===q.id);
      if(!row) return;
      let playerAnswer, allAnswers = null;
      if(q.type==='numeric-tiered' || q.type==='numeric-single'){
        playerAnswer = { playerId, value: (row.answer!=null && row.answer!=='') ? Number(row.answer) : null };
        allAnswers = answers.filter(a=>a.question_id===q.id).map(a=>({ playerId:a.player_id, value:(a.answer!=null && a.answer!=='') ? Number(a.answer) : null }));
      } else {
        playerAnswer = row.answer;
      }
      total += scoreAnswer(q, playerAnswer, correctAnswer, allAnswers).points;
    });
    return total;
  }

  function computeH2HPoints(playerId, roulettePredictions, h2hFixtures){
    let total = 0;
    const myRows = roulettePredictions.filter(r=>r.player_id===playerId);
    const months = [...new Set(myRows.map(r=>r.month))];
    months.forEach(month=>{
      const fixture = h2hFixtures.find(f=>f.month===month);
      const rowsForMonth = myRows.filter(r=>r.month===month);
      total += scoreRoulette(rowsForMonth, fixture).points;
    });
    return total;
  }

  function computeBlackjackPoints(playerId, blackjackPicks){
    const cards = blackjackPicks.filter(c=>c.player_id===playerId);
    return scoreBlackjack(cards).points;
  }

  // ============================================================
  // Tab 1: Leaderboard
  // ============================================================
  async function renderLeaderboard(){
    const panel = document.getElementById('leaderboardPanel');
    const data = await loadAll();
    if(!data){ panel.innerHTML = '<div class="board"><div class="empty">Preview mode — connect Supabase in config.js to see live standings.</div></div>'; return; }
    const { players, picks, answers, questions, teamStats, h2hFixtures, roulettePredictions, blackjackPicks, settings } = data;
    if(players.length===0){ panel.innerHTML = '<div class="board"><div class="empty">No entries yet — be the first to submit picks!</div></div>'; return; }

    const refreshSetting = settings.find(s=>s.key==='last_results_refresh');
    const refreshedLabel = refreshSetting && refreshSetting.value
      ? new Date(refreshSetting.value).toLocaleDateString('en-GB', { day:'2-digit', month:'2-digit', year:'2-digit' })
      : '—';

    const scored = players.map(p => {
      const slotsPts = computeSlotsPoints(p.id, picks, teamStats);
      const h2hPts = computeH2HPoints(p.id, roulettePredictions, h2hFixtures);
      const bjPts = computeBlackjackPoints(p.id, blackjackPicks);
      const questionsPts = computeQuestionsPoints(p.id, answers, questions);
      return { name:p.name, slotsPts, h2hPts, bjPts, questionsPts, total: slotsPts+h2hPts+bjPts+questionsPts };
    });
    scored.sort((a,b)=>b.total-a.total);

    const rows = scored.map((p,i)=>`
      <tr>
        <td class="rank">${i+1}</td>
        <td class="pname">${p.name}</td>
        <td class="num psub">${Math.round(p.slotsPts*100)/100}</td>
        <td class="num psub">${p.h2hPts}</td>
        <td class="num psub">${p.bjPts}</td>
        <td class="num psub">${p.questionsPts}</td>
        <td class="num ptotal">${Math.round(p.total*100)/100}</td>
      </tr>`).join('');

    panel.innerHTML = `
      <div class="board">
        <div class="legend-row"><span><b>Slots</b> = 7 slot picks</span><span><b>Super Sundays</b> = monthly predictions</span><span><b>Blackjack</b> = goals challenge</span><span><b>Questions</b> = 19 answers</span></div>
        <table>
          <tr>
            <th>#</th><th>Player</th>
            <th class="num">Slots<span class="th-sub">(refreshed at ${refreshedLabel})</span></th>
            <th class="num">Super Sundays</th>
            <th class="num">Blackjack</th>
            <th class="num">Questions</th>
            <th class="num">Total</th>
          </tr>
          ${rows}
        </table>
      </div>`;
  }

  // ============================================================
  // Tab 2: Slots — PL table / player picks / actual position mirror
  // ============================================================
  let slotsTabData = null;

  function positionInSlot(position, slotId){
    if(slotId==='1st') return position===1;
    if(slotId==='2nd') return position===2;
    if(slotId==='3-6') return position>=3 && position<=6;
    if(slotId==='7-12') return position>=7 && position<=12;
    if(slotId==='13-18') return position>=13 && position<=18;
    if(slotId==='19') return position===19;
    if(slotId==='20') return position===20;
    return false;
  }

  async function renderSlotsTab(){
    const panel = document.getElementById('slotsPanel');
    if(!sb){ panel.innerHTML = '<div class="board"><div class="empty">Preview mode — connect Supabase in config.js to see this.</div></div>'; return; }
    const [{data:teamStats},{data:players},{data:picks}] = await Promise.all([
      sb.from('team_stats').select('*'),
      sb.from('players').select('*'),
      sb.from('picks').select('*'),
    ]);
    slotsTabData = { teamStats: teamStats||[], players: players||[], picks: picks||[] };

    const list = slotsTabData.teamStats.map(t => ({ ...t, gd: t.goals_for-t.goals_against, pts: t.wins*3+t.draws }));
    list.sort((a,b)=>{
      if(b.pts!==a.pts) return b.pts-a.pts;
      if(b.gd!==a.gd) return b.gd-a.gd;
      if(b.goals_for!==a.goals_for) return b.goals_for-a.goals_for;
      return a.team_name.localeCompare(b.team_name);
    });
    slotsTabData.rankedTable = list;

    const playerOptions = slotsTabData.players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

    panel.innerHTML = `
      <select class="player-select" id="slotsPlayerSelect">
        <option value="">Select Player Name</option>
        ${playerOptions}
      </select>
      <div class="board">
        <div class="legend-row"><span>Full PL table (first-time-fixtures only). Select a player to see their 7 picks — gold + ✅ if currently on track for that slot, red + ❌ if not. Points include the multiplier once a pick is confirmed correct; flat 50 if it finishes wrong.</span></div>
        <div id="slotsUnifiedTableWrap"></div>
      </div>
    `;

    document.getElementById('slotsPlayerSelect').addEventListener('change', renderSlotsUnifiedTable);
    renderSlotsUnifiedTable();
  }

  function renderSlotsUnifiedTable(){
    const sel = document.getElementById('slotsPlayerSelect');
    const playerId = sel ? sel.value : '';
    const { teamStats, picks, rankedTable } = slotsTabData;
    const myPicks = playerId ? picks.filter(p=>p.player_id===playerId) : [];

    const rows = rankedTable.map((t,i) => {
      const position = i+1;
      const pick = myPicks.find(p=>p.team_tag===t.team_tag);
      let slotCell = '<td class="psub">—</td>';
      let resultCell = '<td class="psub">—</td>';
      let pointsCell = '<td class="num psub">—</td>';
      let rowClass = '';
      if(pick){
        const slot = SLOTS.find(s=>s.id===pick.slot);
        const correct = positionInSlot(position, pick.slot);
        const result = pickScore(pick, t);
        rowClass = correct ? 'slot-pick-correct' : 'slot-pick-wrong';
        slotCell = `<td class="pname">${slot?slot.label:pick.slot}</td>`;
        resultCell = `<td>${correct ? '✅' : '❌'}</td>`;
        pointsCell = `<td class="num ptotal">${Math.round(result.points*100)/100}</td>`;
      }
      return `<tr class="${rowClass}">
        <td class="rank">${position}</td>
        <td class="pname"><span class="team-tag-mini">${t.team_tag}</span>${t.team_name}</td>
        <td class="num psub">${t.matches_played}</td>
        <td class="num psub">${t.wins}</td>
        <td class="num psub">${t.goals_for}</td>
        <td class="num psub">${t.gd}</td>
        <td class="num psub">${t.pts}</td>
        ${slotCell}
        ${resultCell}
        ${pointsCell}
      </tr>`;
    }).join('');

    document.getElementById('slotsUnifiedTableWrap').innerHTML = `
      <table>
        <tr><th>#</th><th>Team</th><th class="num">P</th><th class="num">W</th><th class="num">GF</th><th class="num">GD</th><th class="num">Pts</th><th>Your Slot</th><th>On Track?</th><th class="num">Points</th></tr>
        ${rows || '<tr><td colspan="10" class="psub" style="text-align:center; padding:1rem;">No results entered yet.</td></tr>'}
      </table>
    `;
  }

  // ============================================================
  // Tab 3: Super Sunday Recap
  // ============================================================
  async function renderRecapTab(){
    const panel = document.getElementById('recapPanel');
    if(!sb){ panel.innerHTML = '<div class="board"><div class="empty">Preview mode — connect Supabase in config.js to see this.</div></div>'; return; }
    const [{data:h2hFixturesRaw},{data:roulettePredictions},{data:players}] = await Promise.all([
      sb.from('h2h_fixtures').select('*'),
      sb.from('roulette_predictions').select('*'),
      sb.from('players').select('*'),
    ]);
    const h2hFixtures = sortByMonth(h2hFixturesRaw || []);
    const playerName = id => { const p=(players||[]).find(x=>x.id===id); return p?p.name:'—'; };

    function fmtPrediction(cat, pred, fixture){
      const teamA = fixture.team_a ? teamByTag(fixture.team_a) : null;
      const teamB = fixture.team_b ? teamByTag(fixture.team_b) : null;
      if(cat.type==='threeway') return pred.value==='A' ? `${teamA?.name} win` : pred.value==='D' ? 'Draw' : pred.value==='B' ? `${teamB?.name} win` : '—';
      if(cat.type==='twoway') return pred.value==='A' ? (teamA?.name||'Team A') : pred.value==='B' ? (teamB?.name||'Team B') : '—';
      if(cat.type==='yesno') return pred.value==='yes' ? 'Yes' : pred.value==='no' ? 'No' : '—';
      if(cat.type==='scoreline') return (pred.scoreA!=null && pred.scoreB!=null) ? `${pred.scoreA}-${pred.scoreB}` : '—';
      return '—';
    }

    const monthBlocks = (h2hFixtures||[]).map(f=>{
      if(!f.team_a || !f.team_b){
        return `<div class="board" style="margin-bottom:1rem;"><div class="legend-row"><span>${f.month}: fixture not added yet.</span></div></div>`;
      }
      const teamA = teamByTag(f.team_a), teamB = teamByTag(f.team_b);
      const predsThisMonth = (roulettePredictions||[]).filter(p=>p.month===f.month);
      const playerIds = [...new Set(predsThisMonth.map(p=>p.player_id))];

      const rows = playerIds.map(pid => {
        const myRows = predsThisMonth.filter(p=>p.player_id===pid);
        const result = scoreRoulette(myRows, f);
        const tierSummary = result.resolved ? `${result.breakdown.tierCorrectCount}/${result.breakdown.tierEligible}` : `${myRows.filter(r=>rouletteCategoryById(r.category)?.group==='tier').length}/6 answered`;
        const scorelineRow = myRows.find(r=>r.category==='scoreline');
        const scorelineLabel = scorelineRow ? fmtPrediction(rouletteCategoryById('scoreline'), scorelineRow.prediction, f) : '—';
        return `<tr>
          <td class="pname">${playerName(pid)}</td>
          <td class="psub">${tierSummary}</td>
          <td class="psub">${scorelineLabel}</td>
          <td class="num ptotal">${result.resolved ? result.points : '—'}</td>
        </tr>`;
      }).join('');

      const resolved = f.result != null;
      return `
        <div class="board" style="margin-bottom:1rem;">
          <div class="legend-row">
            <span><b>${f.month}${f.fixture_date ? ` (${f.fixture_date})` : ''}: ${teamA.name} v ${teamB.name}</b></span>
            <span>${resolved ? `Final score: ${f.score_a}-${f.score_b}` : 'Not played yet'}</span>
          </div>
          <table>
            <tr><th>Player</th><th>Tier correct</th><th>Scoreline picked</th><th class="num">Points</th></tr>
            ${rows || '<tr><td colspan="4" class="psub" style="text-align:center; padding:1rem;">No predictions yet</td></tr>'}
          </table>
        </div>`;
    }).join('');

    panel.innerHTML = `
      <div class="legend-row" style="margin-bottom:1rem; background:#FCE9B8; border:1px solid #C9A227; border-radius:12px; border-bottom:none; color:#6E5A10;">
        <span>ℹ️ 6 tiered bets: 0/1=0, 2=10, 3=15, 4=25, 5=40, 6=75 points. Exact Scoreline = 50 (standalone). Optional Red Card (lose 25/win 100) and Penalty (lose 15/win 30) apply if used.</span>
      </div>
      ${monthBlocks || '<div class="board"><div class="empty">No Super Sunday fixtures yet.</div></div>'}`;
  }

  // ============================================================
  // Tab 4: Blackjack
  // ============================================================
  async function renderBlackjackTab(){
    const panel = document.getElementById('blackjackPanel');
    if(!sb){ panel.innerHTML = '<div class="board"><div class="empty">Preview mode — connect Supabase in config.js to see this.</div></div>'; return; }
    const [{data:picks},{data:players}] = await Promise.all([
      sb.from('blackjack_picks').select('*'),
      sb.from('players').select('*'),
    ]);
    if(!picks || picks.length===0){ panel.innerHTML = '<div class="board"><div class="empty">No Blackjack submissions yet.</div></div>'; return; }

    const playerName = id => { const p=(players||[]).find(x=>x.id===id); return p?p.name:'Unknown'; };
    const byPlayer = {};
    picks.forEach(c => { (byPlayer[c.player_id] = byPlayer[c.player_id] || []).push(c); });

    const rows = Object.entries(byPlayer).map(([playerId, cards]) => {
      cards.sort((a,b)=>a.card_index-b.card_index);
      const picksLabel = cards.map(c => `${c.player_name} (${c.actual_goals||0})`).join(', ');
      const result = scoreBlackjack(cards);
      const totalLabel = result.bust ? `${result.total} (BUST)` : (!result.valid ? `${result.total} (needs 1+ each)` : `${result.total}`);
      return `<tr>
        <td class="pname">${playerName(playerId)}</td>
        <td class="psub">${picksLabel}</td>
        <td class="num psub">${totalLabel}</td>
        <td class="num ptotal">${result.points}</td>
      </tr>`;
    }).join('');

    panel.innerHTML = `
      <div class="board">
        <div class="legend-row"><span>Every selected player must score 1+ or the entry is worth 0. 16=50, 17=100, 18=150, 19=200, 20=250, 21=400. 22+ is a bust (0).</span></div>
        <table>
          <tr><th>Player</th><th>Players Selected (goals)</th><th class="num">Total</th><th class="num">Points</th></tr>
          ${rows}
        </table>
      </div>`;
  }

  // ============================================================
  // Tab 5: Questions
  // ============================================================
  let questionsTabData = null;

  async function renderQuestionsTab(){
    const panel = document.getElementById('questionsPanel');
    if(!sb){ panel.innerHTML = '<div class="board"><div class="empty">Preview mode — connect Supabase in config.js to see this.</div></div>'; return; }
    const [{data:players},{data:answers},{data:questions}] = await Promise.all([
      sb.from('players').select('*'),
      sb.from('answers').select('*'),
      sb.from('questions').select('*'),
    ]);
    questionsTabData = { players:players||[], answers:answers||[], questions:questions||[] };

    const playerOptions = questionsTabData.players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    panel.innerHTML = `
      <select class="player-select" id="questionsPlayerSelect">
        <option value="">Select Player Name</option>
        ${playerOptions}
      </select>
      <div class="board" id="questionsAnswersBoard" style="display:none;">
        <div id="questionsAnswersList"></div>
      </div>
    `;
    document.getElementById('questionsPlayerSelect').addEventListener('change', renderQuestionsPlayerAnswers);
  }

  function fmtAnswerForDisplay(q, row, correctAnswer){
    const raw = row ? row.answer : null;
    if(raw==null || raw==='') return { text:'—', status:'' };
    let text = '';
    if(q.type==='multi3' || q.type==='single1'){
      text = Array.isArray(raw) ? raw.map(t=>{ const tm=teamByTag(t); return tm?tm.name:t; }).join(', ') : String(raw);
    } else if(q.type==='yesno'){
      text = raw==='yes' ? 'Yes' : raw==='no' ? 'No' : String(raw);
    } else if(q.type==='teamselect'){
      const tm = teamByTag(raw); text = tm ? tm.name : raw;
    } else {
      text = String(raw);
    }
    let status = '';
    if(correctAnswer){
      const scored = scoreAnswer(q, q.type==='numeric-tiered'||q.type==='numeric-single' ? {playerId:'x',value:Number(raw)} : raw, correctAnswer, null);
      if(scored.resolved) status = scored.points>0 ? 'status-correct' : 'status-wrong';
    }
    return { text, status };
  }

  function renderQuestionsPlayerAnswers(){
    const playerId = document.getElementById('questionsPlayerSelect').value;
    const board = document.getElementById('questionsAnswersBoard');
    if(!playerId){ board.style.display='none'; return; }
    const { answers, questions } = questionsTabData;

    const rows = QUESTIONS.map(q => {
      const row = answers.find(a=>a.player_id===playerId && a.question_id===q.id);
      const dbQ = questions.find(x=>x.id===q.id);
      const correctAnswer = dbQ ? dbQ.correct_answer : null;
      const { text } = fmtAnswerForDisplay(q, row, correctAnswer);
      return `<tr><td class="pname">Q${q.id}: ${q.short}</td><td class="num psub">${text}</td></tr>`;
    }).join('');

    document.getElementById('questionsAnswersList').innerHTML = `<table>${rows}</table>`;
    board.style.display = 'block';
  }

  renderLeaderboard();
  setInterval(()=>{ document.getElementById('tabLeaderboard').classList.contains('active') && renderLeaderboard(); }, 30000);
</script>
</body>
