<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PREMiQ19 Casino — Leaderboard</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PremIQ19">
<meta name="theme-color" content="#0F3D2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="questions-data.js"></script>
<style>
  :root{ --pitch-dark:#0B2E22; --pitch:#0F3D2C; --chalk:#F6F5EF; --chalk-dim:#EAE7DB; --ink:#122019; --ink-soft:#5C6B62; --line:#DCD8C9; --gold:#CBA633; }
  *{box-sizing:border-box;}
  body{ margin:0; background:radial-gradient(1200px 600px at 15% -10%, rgba(255,255,255,0.05), transparent 60%), var(--pitch-dark); font-family:'Inter',sans-serif; color:var(--ink); min-height:100vh; }
  .header{ background:linear-gradient(180deg, var(--pitch) 0%, var(--pitch-dark) 100%); padding:1.6rem 1rem 1.2rem; text-align:center; border-bottom:3px solid rgba(203,166,51,0.5); }
  .header h1{ font-family:'Bebas Neue',sans-serif; font-size:clamp(1.8rem,7vw,3rem); color:var(--chalk); margin:0; }
  .header h1 span{ color:var(--gold); }
  .header p{ color:#B9C4BB; font-size:0.78rem; margin:0.5rem 0 0; }
  a.back-link{ color:var(--gold); font-family:'Space Mono',monospace; font-size:0.7rem; text-decoration:underline; }
  .wrap{ max-width:1100px; margin:0 auto; padding:1.2rem 0.8rem 3rem; }

  .tab-bar{ display:flex; gap:1.1rem; margin-bottom:1rem; border-bottom:1.5px solid rgba(255,255,255,0.18); padding:0 0.2rem; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .tab-bar::-webkit-scrollbar{ display:none; }
  .tab-btn{ flex-shrink:0; }
  .tab-btn{ font-family:'Bebas Neue',sans-serif; font-size:1.05rem; letter-spacing:0.02em; background:none; border:none; border-bottom:3px solid transparent; color:#B9C4BB; padding:0.5rem 0.1rem; cursor:pointer; }
  .tab-btn.active{ color:var(--chalk); border-bottom-color:var(--gold); }

  .board{ background:var(--chalk); border-radius:16px; overflow-x:auto; overflow-y:hidden; box-shadow:0 20px 40px -20px rgba(0,0,0,0.4); -webkit-overflow-scrolling:touch; }
  .board table{ min-width:100%; }
  .empty{ text-align:center; padding:2rem; color:var(--ink-soft); font-size:0.85rem; }

  table{ width:100%; border-collapse:collapse; font-size:0.8rem; }
  th, td{ text-align:left; padding:0.55rem 0.6rem; border-bottom:1px solid var(--line); white-space:nowrap; }
  th{ font-family:'Space Mono',monospace; font-size:0.62rem; text-transform:uppercase; color:var(--ink-soft); }
  th.num, td.num{ text-align:right; }
  th .th-sub{ display:block; text-transform:none; font-size:0.6rem; color:var(--ink-soft); font-weight:400; margin-top:0.15rem; }

  .rank{ font-family:'Bebas Neue',sans-serif; font-size:1.15rem; color:var(--ink-soft); width:1.6rem; }
  tr:nth-child(1) .rank{ color:#CBA633; } tr:nth-child(2) .rank{ color:#8C9199; } tr:nth-child(3) .rank{ color:#B08050; }
  .pname{ font-weight:700; }
  .ptotal{ font-family:'Space Mono',monospace; font-weight:800; color:var(--pitch); }
  .psub{ font-family:'Space Mono',monospace; color:var(--ink-soft); }

  .legend-row{ display:flex; gap:1rem; padding:0.7rem 1rem; font-size:0.68rem; color:var(--ink-soft); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .legend-row span b{ color:var(--ink); }

  .player-select{
    width:100%; padding:0.6rem 0.7rem; border:1.5px solid var(--line); border-radius:9px; font-size:0.85rem;
    margin-bottom:0.8rem; font-family:'Inter',sans-serif; background:#fff;
  }
  .btn-results-toggle{
    font-family:'Bebas Neue',sans-serif; font-size:1rem; letter-spacing:0.02em; color:var(--pitch-dark);
    background:var(--gold); border:none; padding:0.65rem 1.4rem; border-radius:999px; cursor:pointer;
    box-shadow:0 8px 18px -8px rgba(0,0,0,0.4);
  }

  .slot-pick-correct{ background:rgba(203,166,51,0.22) !important; }
  .qa-correct{ background:rgba(46,139,87,0.14) !important; }
  .qa-points{ font-family:'Space Mono',monospace; font-weight:800; color:var(--pitch); font-size:0.72rem; background:rgba(203,166,51,0.18); border-radius:6px; }

  .month-collapse{
    background:var(--chalk); border-radius:16px; overflow:hidden; box-shadow:0 20px 40px -20px rgba(0,0,0,0.4);
    margin-bottom:1rem;
  }
  .month-collapse summary{
    list-style:none; cursor:pointer; padding:0.9rem 1.1rem; display:flex; align-items:center; justify-content:space-between;
    gap:0.6rem; font-size:0.85rem; background:var(--chalk-dim); flex-wrap:wrap;
  }
  .month-collapse summary::-webkit-details-marker{ display:none; }
  .month-collapse summary::before{ content:'▶'; margin-right:0.6rem; font-size:0.7rem; color:var(--ink-soft); transition:transform .15s ease; display:inline-block; }
  .month-collapse[open] summary::before{ transform:rotate(90deg); }
  .recap-summary-status{ font-family:'Space Mono',monospace; font-size:0.68rem; color:var(--ink-soft); }
  .month-collapse-body{ padding:0.9rem 1rem; }

  .recap-player-card{ border:1.5px solid var(--line); border-radius:12px; padding:0.7rem 0.85rem; margin-bottom:0.7rem; }
  .recap-player-card:last-child{ margin-bottom:0; }
  .recap-player-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:0.5rem; }
  .recap-player-name{ font-family:'Bebas Neue',sans-serif; font-size:1.05rem; }
  .recap-player-points{
    font-family:'Space Mono',monospace; font-weight:800; color:var(--ink); font-size:0.9rem;
    background:var(--gold); padding:0.25rem 0.65rem; border-radius:999px;
  }
  .recap-pick-line{ display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:0.35rem; }
  .recap-pick-line:last-child{ margin-bottom:0; }
  .recap-pick{
    display:flex; flex-direction:column; background:var(--chalk-dim); border-radius:8px; padding:0.3rem 0.5rem;
    flex:1 1 auto; min-width:90px; border:1.5px solid transparent;
  }
  .recap-pick-green{ background:rgba(46,139,87,0.16); border-color:rgba(46,139,87,0.4); }
  .recap-pick-red{ background:rgba(163,38,56,0.1); border-color:rgba(163,38,56,0.35); }
  .recap-pick-grey{ opacity:0.65; }
  .recap-pick-label{ font-family:'Space Mono',monospace; font-size:0.56rem; text-transform:uppercase; color:var(--ink-soft); letter-spacing:0.03em; }
  .recap-pick-value{ font-size:0.78rem; font-weight:700; color:var(--ink); }
  .qa-wrong{ background:rgba(163,38,56,0.08) !important; }
  .slot-pick-correct td{ font-weight:700; }
  .slot-pick-wrong{ background:rgba(163,38,56,0.1) !important; }
  .team-tag-mini{
    display:inline-block; font-family:'Space Mono',monospace; font-size:0.62rem; font-weight:700;
    background:var(--pitch); color:var(--chalk); padding:0.12rem 0.35rem; border-radius:5px; margin-right:0.4rem;
  }

  /* ===== v2 layout: slots rows + question tiles ===== */
  .v2-sechead{ font-family:'Space Mono',monospace; font-size:0.66rem; text-transform:uppercase; color:#B9C4BB; letter-spacing:0.04em; margin:1.2rem 0.2rem 0.6rem; }
  .v2-card{ background:var(--chalk); border-radius:14px; margin-bottom:0.7rem; overflow:hidden; box-shadow:0 14px 30px -20px rgba(0,0,0,0.5); }
  .v2-top{ display:grid; grid-template-columns:68px minmax(0,1fr) 58px; gap:0.6rem; align-items:center; padding:0.75rem 0.7rem 0.5rem; }
  .v2-nm{ font-weight:700; font-size:0.9rem; word-break:break-word; }
  .v2-nm small{ display:block; font-weight:500; font-size:0.68rem; color:var(--ink-soft); font-family:'Space Mono',monospace; }
  .v2-bars{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
  .v2-bar{ border-radius:7px; background:var(--chalk-dim); border:1px solid var(--line); text-align:center; padding:5px 1px 4px; }
  .v2-bar .s{ font-size:0.54rem; color:var(--ink-soft); line-height:1.1; min-height:1.3rem; display:flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; }
  .v2-bar .t{ font-size:0.72rem; font-weight:800; margin-top:2px; }
  .v2-bar.gold{ background:var(--gold); border-color:#8E7220; }
  .v2-bar.gold .s, .v2-bar.gold .t{ color:#2A2205; }
  .v2-sc{ text-align:right; font-family:'Space Mono',monospace; font-weight:800; font-size:1rem; color:var(--pitch); }
  .v2-sc small{ display:block; font-size:0.58rem; color:var(--ink-soft); font-weight:400; }
  .v2-xp{ display:block; width:100%; background:none; border:none; border-top:1px solid var(--line); padding:0.55rem; font-family:'Inter',sans-serif; font-size:0.78rem; font-weight:700; color:var(--pitch); cursor:pointer; }
  .v2-xp:hover{ background:var(--chalk-dim); }
  .v2-dt{ display:none; padding:0 0.7rem 0.7rem; overflow-x:auto; }
  .v2-card.open .v2-dt{ display:block; }
  .v2-dt table{ font-size:0.7rem; }
  .v2-dt th, .v2-dt td{ padding:0.45rem 0.3rem; white-space:normal; }
  .v2-dt .tag{ display:inline-block; font-size:0.62rem; padding:0.1rem 0.45rem; border-radius:999px; margin-left:0.35rem; font-weight:700; }
  .v2-dt .tag.y{ background:rgba(203,166,51,0.3); color:#5C4A0C; }
  .v2-dt .tag.n{ background:var(--chalk-dim); color:var(--ink-soft); }
  .v2-note{ font-size:0.66rem; color:var(--ink-soft); line-height:1.5; margin-top:0.5rem; white-space:normal; }
  .v2-fl{ display:flex; gap:0.45rem; flex-wrap:wrap; margin:0.2rem 0 0.8rem; }
  .v2-chip{ font-family:'Inter',sans-serif; font-size:0.74rem; padding:0.35rem 0.8rem; border-radius:999px; border:1px solid rgba(255,255,255,0.3); background:none; color:#B9C4BB; cursor:pointer; }
  .v2-chip.on{ background:var(--chalk); color:var(--pitch-dark); border-color:var(--chalk); font-weight:700; }
  .v2-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:0.55rem; }
  .v2-tile{ background:var(--chalk); border:2px solid transparent; border-radius:14px; padding:0.75rem; text-align:left; cursor:pointer; font-family:'Inter',sans-serif; color:var(--ink); display:block; width:100%; }
  .v2-tile.sel{ border-color:var(--gold); }
  .v2-tn{ display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem; gap:0.4rem; }
  .v2-qn{ font-family:'Space Mono',monospace; font-size:0.66rem; color:var(--ink-soft); font-weight:700; }
  .v2-pill{ font-size:0.62rem; font-weight:700; padding:0.15rem 0.55rem; border-radius:999px; white-space:nowrap; }
  .v2-pill.ok{ background:rgba(46,139,87,0.18); color:#1D6B3F; }
  .v2-pill.no{ background:rgba(163,38,56,0.14); color:#8A1F30; }
  .v2-pill.op{ background:rgba(203,166,51,0.28); color:#5C4A0C; }
  .v2-pill.dn{ background:var(--chalk-dim); color:var(--ink-soft); }
  .v2-tt{ font-size:0.84rem; font-weight:700; line-height:1.3; min-height:2.2rem; }
  .v2-live{ font-size:0.7rem; color:var(--ink-soft); margin:0.3rem 0 0.5rem; line-height:1.35; word-break:break-word; }
  .v2-rt{ border-top:1px solid var(--line); padding-top:0.5rem; }
  .v2-rt .l{ font-size:0.6rem; color:var(--ink-soft); font-family:'Space Mono',monospace; margin-bottom:0.35rem; }
  .v2-av{ display:flex; align-items:center; flex-wrap:wrap; }
  .v2-a{ width:24px; height:24px; border-radius:50%; background:var(--gold); color:#2A2205; font-size:0.56rem; font-weight:800; display:flex; align-items:center; justify-content:center; border:2px solid var(--chalk); margin-left:-6px; }
  .v2-a:first-child{ margin-left:0; }
  .v2-a.me{ background:var(--pitch); color:var(--chalk); }
  .v2-a.more{ background:var(--chalk-dim); color:var(--ink-soft); }
  .v2-none{ font-size:0.7rem; color:var(--ink-soft); }
  .v2-ft{ display:flex; justify-content:space-between; align-items:baseline; margin-top:0.55rem; padding-top:0.45rem; border-top:1px solid var(--line); font-size:0.64rem; color:var(--ink-soft); }
  .v2-ft b{ font-family:'Space Mono',monospace; font-size:0.95rem; color:var(--pitch); }
  .v2-ft b.z{ color:var(--ink-soft); font-weight:400; }
  .v2-panel{ background:var(--chalk); border-radius:14px; padding:0.9rem; margin-top:0.8rem; }
  .v2-panel h3{ margin:0 0 0.2rem; font-size:0.95rem; }
  .v2-panel .lbl{ font-size:0.74rem; color:var(--ink-soft); line-height:1.45; margin-bottom:0.2rem; }
  .v2-boxes{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:0.5rem; margin:0.7rem 0; }
  .v2-box{ background:var(--chalk-dim); border-radius:9px; padding:0.5rem 0.65rem; }
  .v2-box .k{ font-size:0.6rem; color:var(--ink-soft); font-family:'Space Mono',monospace; }
  .v2-box .v{ font-size:0.82rem; font-weight:700; margin-top:0.1rem; word-break:break-word; }
  .v2-msg{ font-size:0.8rem; line-height:1.5; padding:0.55rem 0.7rem; border-radius:9px; margin-bottom:0.4rem; }
  .v2-msg.ok{ background:rgba(46,139,87,0.14); }
  .v2-msg.no{ background:rgba(163,38,56,0.1); }
  .v2-msg.op, .v2-msg.dn{ background:var(--chalk-dim); }
  .v2-panel table{ margin-top:0.6rem; }
  .v2-panel tr.me td{ background:rgba(203,166,51,0.22); font-weight:700; }
  .v2-summary{ display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:0.8rem; }
  .v2-summary .v2-box{ background:var(--chalk); flex:1 1 140px; }
  @media(max-width:520px){ .v2-top{ grid-template-columns:50px minmax(0,1fr) 46px; gap:0.35rem; padding:0.65rem 0.45rem 0.4rem; } .v2-bar .s{ font-size:0.5rem; } .v2-bar .t{ font-size:0.66rem; } .v2-nm{ font-size:0.78rem; } }
</style>

<body>
  <div class="header">
    <h1>PREM<span>iQ19</span> CASINO</h1>
    <p>Live Leaderboard</p>
    <p><a class="back-link" href="index.html">← Back to picks</a></p>
    <p><a href="admin.html" style="color:#6E7C74; font-family:'Space Mono',monospace; font-size:0.62rem; text-decoration:underline;">Admin</a></p>
  </div>

  <div class="wrap">
    <div id="leaderboardLockedNotice" style="display:none;" class="board">
      <div class="empty" style="padding:3rem 1.5rem;">
        <div style="font-size:2.2rem; margin-bottom:0.8rem;">🔒</div>
        <p style="font-size:1rem; font-weight:700; color:var(--ink); margin-bottom:0.5rem;">The leaderboard isn't open yet</p>
        <p style="font-size:0.85rem;">The organiser will open this up once the season begins. Check back soon!</p>
      </div>
    </div>

    <div id="leaderboardMainContent" style="display:none;">
    <div class="tab-bar">
      <button class="tab-btn active" id="tabLeaderboard">Leaderboard</button>
      <button class="tab-btn" id="tabSlots">Slots</button>
      <button class="tab-btn" id="tabRecap">Super Sunday Recap</button>
      <button class="tab-btn" id="tabBlackjack">Blackjack</button>
      <button class="tab-btn" id="tabQuestions">Questions</button>
    </div>

    <div id="leaderboardPanel"><div class="board"><div class="empty">Loading…</div></div></div>
    <div id="slotsPanel" style="display:none;"></div>
    <div id="recapPanel" style="display:none;"></div>
    <div id="blackjackPanel" style="display:none;"></div>
    <div id="questionsPanel" style="display:none;"></div>
    </div>
  </div>

<script>
  let sb = null;
  try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
  catch(err){ console.warn('Supabase not configured yet — running in preview mode.', err); }

  document.getElementById('tabLeaderboard').addEventListener('click', ()=>switchTab('leaderboard'));
  document.getElementById('tabSlots').addEventListener('click', ()=>switchTab('slots'));
  document.getElementById('tabRecap').addEventListener('click', ()=>switchTab('recap'));
  document.getElementById('tabBlackjack').addEventListener('click', ()=>switchTab('blackjack'));
  document.getElementById('tabQuestions').addEventListener('click', ()=>switchTab('questions'));

  function switchTab(tab){
    ['Leaderboard','Slots','Recap','Blackjack','Questions'].forEach(t=>{
      document.getElementById('tab'+t).classList.toggle('active', t.toLowerCase()===tab);
    });
    ['leaderboardPanel','slotsPanel','recapPanel','blackjackPanel','questionsPanel'].forEach(id=>{
      document.getElementById(id).style.display = id === tab+'Panel' ? 'block' : 'none';
    });
    if(tab==='leaderboard') renderLeaderboard();
    else if(tab==='slots') renderSlotsTab();
    else if(tab==='recap') renderRecapTab();
    else if(tab==='blackjack') renderBlackjackTab();
    else if(tab==='questions') renderQuestionsTab();
  }

  async function loadAll(){
    if(!sb) return null;
    const [{data:players},{data:picks},{data:answers},{data:questions},{data:teamStats},{data:h2hFixtures},{data:roulettePreds},{data:blackjackPicks},{data:settings}] = await Promise.all([
      sb.from('players').select('*'),
      sb.from('picks').select('*'),
      sb.from('answers').select('*'),
      sb.from('questions').select('*'),
      sb.from('team_stats').select('*'),
      sb.from('h2h_fixtures').select('*'),
      sb.from('roulette_predictions').select('*'),
      sb.from('blackjack_picks').select('*'),
      sb.from('settings').select('*'),
    ]);
    return {
      players:players||[], picks:picks||[], answers:answers||[], questions:questions||[], teamStats:teamStats||[],
      h2hFixtures:sortByMonth(h2hFixtures||[]), roulettePredictions:roulettePreds||[], blackjackPicks:blackjackPicks||[],
      settings:settings||[],
    };
  }

  function statsFor(teamStats, tag){ return teamStats.find(s=>s.team_tag===tag); }
  function slotOrder(slotId){ return SLOTS.findIndex(s=>s.id===slotId); }

  function buildRankedTable(teamStats){
    const list = teamStats.map(t => ({ ...t, gd: t.goals_for-t.goals_against, pts: t.wins*3+t.draws }));
    list.sort((a,b)=>{
      if(b.pts!==a.pts) return b.pts-a.pts;
      if(b.gd!==a.gd) return b.gd-a.gd;
      if(b.goals_for!==a.goals_for) return b.goals_for-a.goals_for;
      return a.team_name.localeCompare(b.team_name);
    });
    return list;
  }
  function currentPositionFor(rankedTable, tag){
    const idx = rankedTable.findIndex(t=>t.team_tag===tag);
    return idx===-1 ? null : idx+1;
  }

  function computeSlotsPoints(playerId, picks, teamStats){
    const myPicks = picks.filter(p=>p.player_id===playerId);
    const rankedTable = buildRankedTable(teamStats);
    let total = 0;
    myPicks.forEach(p=>{
      const stats = statsFor(teamStats, p.team_tag);
      const position = currentPositionFor(rankedTable, p.team_tag);
      total += pickScore(p, stats, position).points;
    });
    return total;
  }

  function computeQuestionsPoints(playerId, answers, questions){
    let total = 0;
    QUESTIONS.forEach(q=>{
      const dbQ = questions.find(x=>x.id===q.id);
      const correctAnswer = dbQ ? dbQ.correct_answer : null;
      const row = answers.find(a=>a.player_id===playerId && a.question_id===q.id);
      if(!row) return;
      let playerAnswer, allAnswers = null;
      if(q.type==='numeric-tiered' || q.type==='numeric-single'){
        playerAnswer = { playerId, value: (row.answer!=null && row.answer!=='') ? Number(row.answer) : null };
        allAnswers = answers.filter(a=>a.question_id===q.id).map(a=>({ playerId:a.player_id, value:(a.answer!=null && a.answer!=='') ? Number(a.answer) : null }));
      } else {
        playerAnswer = row.answer;
      }
      total += scoreAnswer(q, playerAnswer, correctAnswer, allAnswers).points;
    });
    return total;
  }

  function computeH2HPoints(playerId, roulettePredictions, h2hFixtures){
    let total = 0;
    const myRows = roulettePredictions.filter(r=>r.player_id===playerId);
    const months = [...new Set(myRows.map(r=>r.month))];
    months.forEach(month=>{
      const fixture = h2hFixtures.find(f=>f.month===month);
      const rowsForMonth = myRows.filter(r=>r.month===month);
      total += scoreRoulette(rowsForMonth, fixture).points;
    });
    return total;
  }

  function computeBlackjackPoints(playerId, blackjackPicks){
    const cards = blackjackPicks.filter(c=>c.player_id===playerId);
    return scoreBlackjack(cards).points;
  }

  // ============================================================
  // Tab 1: Leaderboard
  // ============================================================
  async function renderLeaderboard(){
    const panel = document.getElementById('leaderboardPanel');
    const data = await loadAll();
    if(!data){ panel.innerHTML = '<div class="board"><div class="empty">Preview mode — connect Supabase in config.js to see live standings.</div></div>'; return; }
    const { players, picks, answers, questions, teamStats, h2hFixtures, roulettePredictions, blackjackPicks, settings } = data;

  const SLOT_SHORT = {'1st':'1st','2nd':'2nd','3-6':'3rd to 6th','7-12':'7th to 12th','13-18':'13th to 18th','19':'19th','20':'20th'};
  function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
  function r2(x){ return Math.round(x*100)/100; }

  function renderSlotsGlance(){
    const el = document.getElementById('slotsGlance');
    if(!el || !slotsTabData) return;
    const { players, picks, teamStats, rankedTable } = slotsTabData;
    if(!players.length){ el.innerHTML = ''; return; }
    const cards = players.map(pl=>{
      const mine = picks.filter(p=>p.player_id===pl.id);
      const rows = SLOTS.map(slot=>{
        const pick = mine.find(p=>p.slot===slot.id);
        if(!pick) return { slot, pick:null, res:null, on:false };
        const stats = statsFor(teamStats, pick.team_tag);
        const pos = currentPositionFor(rankedTable, pick.team_tag);
        const res = pickScore(pick, stats, pos);
        const on = res.status==='correct' || res.status==='provisional-correct';
        return { slot, pick, stats, pos, res, on };
      });
      const total = r2(rows.reduce((a,x)=>a+(x.res?x.res.points:0),0));
      return { pl, rows, total, ok: rows.filter(x=>x.on).length };
    }).sort((a,b)=> b.total-a.total || a.pl.name.localeCompare(b.pl.name));

    el.innerHTML = '<div class="v2-sechead">Everyone\'s slots. Gold means the pick is in its zone right now</div>' + cards.map(c=>{
      const bars = c.rows.map(x=>`<div class="v2-bar${x.on?' gold':''}"><div class="s">${SLOT_SHORT[x.slot.id]||x.slot.label}</div><div class="t">${x.pick?esc(x.pick.team_tag):'—'}</div></div>`).join('');
      const body = c.rows.map(x=>{
        if(!x.pick) return `<tr><td class="pname">${SLOT_SHORT[x.slot.id]}</td><td class="psub" colspan="6">No pick</td></tr>`;
        const t = teamByTag(x.pick.team_tag);
        const w = x.stats ? x.stats.wins : 0, gf = x.stats ? x.stats.goals_for : 0;
        const tag = x.on ? '<span class="tag y">in zone</span>' : `<span class="tag n">${x.pos?'now '+ordinal(x.pos):'no data'}</span>`;
        const pts = x.res ? r2(x.res.points) : 0;
        const ptsTxt = x.res && x.res.status==='wrong' ? pts+' (flat)' : pts;
        return `<tr><td class="pname">${SLOT_SHORT[x.slot.id]}</td><td>${esc(t?t.name:x.pick.team_tag)}${tag}</td><td class="num psub">${w}W, ${gf}G</td><td class="num psub">${w*3+gf*2}</td><td class="psub">x${x.slot.mult}</td><td class="num ptotal">${ptsTxt}</td></tr>`;
      }).join('');
      return `<div class="v2-card"><div class="v2-top"><div class="v2-nm">${esc(c.pl.name)}<small>${c.ok}/7</small></div><div class="v2-bars">${bars}</div><div class="v2-sc">${c.total}<small>pts</small></div></div>
        <div class="v2-dt"><table><tr><th>Slot</th><th>Pick</th><th class="num">Wins, goals</th><th class="num">Base</th><th>Mult</th><th class="num">Points</th></tr>${body}</table>
        <div class="v2-note">Base is wins x 3 plus goals x 2. A pick in its zone scores base x multiplier. A pick outside its zone scores 0 for now, and a flat 50 if it is still wrong when the season ends.</div></div>
        <button class="v2-xp" data-lbl="open">See full details</button></div>`;
    }).join('');
    el.querySelectorAll('.v2-xp').forEach(b=>b.addEventListener('click', ()=>{
      const card = b.parentNode, o = card.classList.toggle('open');
      b.textContent = o ? 'Hide details' : 'See full details';
    }));
  }

  async function renderRecapTab(){
    const panel = document.getElementById('recapPanel');
    if(!sb){ panel.innerHTML = '<div class="board"><div class="empty">Preview mode — connect Supabase in config.js to see this.</div></div>'; return; }
    const [{data:h2hFixturesRaw},{data:roulettePredictions},{data:players},{data:lockData}] = await Promise.all([
      sb.from('h2h_fixtures').select('*'),
      sb.from('roulette_predictions').select('*'),
      sb.from('players').select('*'),
      sb.from('settings').select('*').eq('key','roulette_open').maybeSingle(),
    ]);
    const rouletteOpen = lockData ? lockData.value === 'true' : false;

    if(rouletteOpen){
      panel.innerHTML = `
        <div class="board"><div class="empty" style="padding:3rem 1.5rem;">
          <div style="font-size:2.2rem; margin-bottom:0.8rem;">🔒</div>
          <p style="font-size:1rem; font-weight:700; color:var(--ink); margin-bottom:0.5rem;">Picks are kept secret while Monthly Super Sundays is open</p>
          <p style="font-size:0.85rem;">This stops anyone seeing what others have picked before the window closes. Once the organiser locks Monthly Super Sundays again, everyone's picks will show here.</p>
        </div></div>`;
      return;
    }

    const h2hFixtures = sortByMonth(h2hFixturesRaw || []);
    const playerName = id => { const p=(players||[]).find(x=>x.id===id); return p?p.name:'—'; };

    function fmtPrediction(cat, pred, fixture){
      const teamA = fixture.team_a ? teamByTag(fixture.team_a) : null;
      const teamB = fixture.team_b ? teamByTag(fixture.team_b) : null;
      if(!pred) return cat.group==='optional' ? 'Not Picked' : '—';
      if(cat.type==='threeway') return pred.value==='A' ? `${teamA?.name} win` : pred.value==='D' ? 'Draw' : pred.value==='B' ? `${teamB?.name} win` : '—';
      if(cat.type==='twoway') return pred.value==='A' ? (teamA?.name||'Team A') : pred.value==='B' ? (teamB?.name||'Team B') : '—';
      if(cat.type==='yesno') return pred.value==='yes' ? 'Yes' : pred.value==='no' ? 'No' : '—';
      if(cat.type==='scoreline') return (pred.scoreA!=null && pred.scoreA!=='' && pred.scoreB!=null && pred.scoreB!=='') ? `${pred.scoreA}-${pred.scoreB}` : '—';
      return '—';
    }

    // Green if correct, red if wrong, grey if not picked / not resolved yet /
    // handed-back (tied corners, neither carded — genuinely neutral, not wrong).
    function pickColorClass(cat, row, fixture){
      if(!row) return 'grey';
      if(!rouletteCategoryResolved(cat.id, fixture)) return 'grey';
      if(cat.id==='scoreline'){
        const p = row.prediction;
        const correct = p.scoreA!=null && p.scoreA!=='' && p.scoreB!=null && p.scoreB!==''
          && p.scoreA == fixture.score_a && p.scoreB == fixture.score_b;
        return correct ? 'green' : 'red';
      }
      if(cat.group==='tier'){
        const outcome = rouletteCategoryOutcome(cat.id, row.prediction, fixture);
        if(outcome==='handedback') return 'grey';
        return outcome ? 'green' : 'red';
      }
      if(cat.group==='optional'){
        const actual = cat.id==='redcard' ? fixture.redcard_actual : fixture.penalty_actual;
        if(actual==null) return 'grey';
        const correct = row.prediction.value === (actual ? 'yes' : 'no');
        return correct ? 'green' : 'red';
      }
      return 'grey';
    }

    const LINE1_CATS = ['result','btts','corners','shots','yellowcard','outsidebox'];
    const LINE2_CATS = ['scoreline','redcard','penalty'];

    const monthBlocks = (h2hFixtures||[]).map((f, idx)=>{
      if(!f.team_a || !f.team_b){
        return `<details class="month-collapse"><summary>${f.month} — fixture not added yet</summary></details>`;
      }
      const teamA = teamByTag(f.team_a), teamB = teamByTag(f.team_b);
      const predsThisMonth = (roulettePredictions||[]).filter(p=>p.month===f.month);
      const playerIds = [...new Set(predsThisMonth.map(p=>p.player_id))];

      const playerCards = playerIds.map(pid => {
        const myRows = predsThisMonth.filter(p=>p.player_id===pid);
        const byId = {}; myRows.forEach(r => byId[r.category] = r);
        const result = scoreRoulette(myRows, f);
        const pointsLabel = result.resolved ? `${result.points} pts` : 'Not resolved yet';

        const line1 = LINE1_CATS.map(catId => {
          const cat = rouletteCategoryById(catId);
          const row = byId[catId];
          const colorClass = pickColorClass(cat, row, f);
          return `<span class="recap-pick recap-pick-${colorClass}"><span class="recap-pick-label">${cat.name}</span><span class="recap-pick-value">${fmtPrediction(cat, row?row.prediction:null, f)}</span></span>`;
        }).join('');
        const line2 = LINE2_CATS.map(catId => {
          const cat = rouletteCategoryById(catId);
          const row = byId[catId];
          const colorClass = pickColorClass(cat, row, f);
          return `<span class="recap-pick recap-pick-${colorClass}"><span class="recap-pick-label">${cat.name}</span><span class="recap-pick-value">${fmtPrediction(cat, row?row.prediction:null, f)}</span></span>`;
        }).join('');

        return `
          <div class="recap-player-card">
            <div class="recap-player-head"><span class="recap-player-name">${playerName(pid)}</span><span class="recap-player-points">${pointsLabel}</span></div>
            <div class="recap-pick-line">${line1}</div>
            <div class="recap-pick-line">${line2}</div>
          </div>`;
      }).join('');

      const resolved = f.result != null;
      return `
        <details class="month-collapse" ${idx===0 ? 'open' : ''}>
          <summary>
            <span><b>${f.month}${f.fixture_date ? ` (${f.fixture_date})` : ''}</b> — ${teamA.name} v ${teamB.name}</span>
            <span class="recap-summary-status">${resolved ? `Final: ${f.score_a}-${f.score_b}` : 'Not played yet'}</span>
          </summary>
          <div class="month-collapse-body">
            ${playerCards || '<p class="psub" style="text-align:center; padding:1rem;">No predictions yet</p>'}
          </div>
        </details>`;
    }).join('');

    panel.innerHTML = `
      <div class="legend-row" style="margin-bottom:1rem; background:#FCE9B8; border:1px solid #C9A227; border-radius:12px; border-bottom:none; color:#6E5A10;">
        <span>ℹ️ 6 tiered bets: 0=0, 1=10, 2=15, 3=20, 4=40, 5=50, 6=75 points. Exact Scoreline = 50 (standalone). Optional Red Card (lose 25/win 100) and Penalty (lose 15/win 30) apply if used.</span>
      </div>
      ${monthBlocks || '<div class="board"><div class="empty">No Super Sunday fixtures yet.</div></div>'}`;
  }

      <div id="qSummary"></div>
      <div class="v2-fl" id="qFilters"></div>
      <div class="v2-grid" id="qGrid"></div>
      <div class="v2-panel" id="qPanel"></div>
    `;
    const sel = document.getElementById('questionsPlayerSelect');
    sel.value = prevVal;
    sel.addEventListener('change', renderQuestionsPlayerAnswers);
    renderQuestionsPlayerAnswers();
  }

  function fmtAnswerForDisplay(q, row, correctAnswer, allAnswersRaw){
    const raw = row ? row.answer : null;
    if(raw==null || raw==='') return { text:'—', status:'unanswered', points:null };
    let text = '';
    if(q.type==='multi3' || q.type==='single1'){
      text = Array.isArray(raw) ? raw.map(t=>{ const tm=teamByTag(t); return tm?tm.name:t; }).join(', ') : String(raw);
    } else if(q.type==='yesno'){
      text = raw==='yes' ? 'Yes' : raw==='no' ? 'No' : String(raw);
    } else if(q.type==='teamselect'){
      const tm = teamByTag(raw); text = tm ? tm.name : raw;
    } else if(q.type==='numeric-tiered' || q.type==='numeric-single'){
      text = `${raw} ${q.unit||''}`.trim();
    } else {
      text = String(raw);
    }

    if(!correctAnswer) return { text, status:'pending', points:null };

    let playerAnswerForScoring, allAnswersForScoring = null;
    if(q.type==='numeric-tiered' || q.type==='numeric-single'){
      playerAnswerForScoring = { playerId: row.player_id, value: (raw!=null && raw!=='') ? Number(raw) : null };
      allAnswersForScoring = (allAnswersRaw||[]).filter(a=>a.question_id===q.id).map(a=>({ playerId:a.player_id, value: (a.answer!=null && a.answer!=='') ? Number(a.answer) : null }));
    } else {
      playerAnswerForScoring = raw;
    }
    const scored = scoreAnswer(q, playerAnswerForScoring, correctAnswer, allAnswersForScoring);
    if(scored.open && scored.points>0) return { text, status:'partial', points:scored.points };
    if(!scored.resolved) return { text, status:'pending', points:null, open: !!correctAnswer.open };
    return { text, status: scored.points>0 ? 'correct' : 'wrong', points: scored.points };
  }

  function maxPtsOf(q){
    if(typeof q.points==='number') return q.points;
    if(q.points && typeof q.points==='object') return Math.max(...Object.values(q.points));
    if(q.yesPoints!=null) return Math.max(q.yesPoints, q.noPoints);
    if(q.aPoints!=null) return Math.max(q.aPoints, q.bPoints);
    return 0;
  }

  function buildQuestionModels(){
    const { players, answers, questions } = questionsTabData;
    return QUESTIONS.map(q=>{
      const dbQ = questions.find(x=>x.id===q.id);
      const ca = dbQ ? dbQ.correct_answer : null;
      const live = dbQ ? dbQ.live_update : null;
      const per = players.map(pl=>{
        const row = answers.find(a=>a.player_id===pl.id && a.question_id===q.id);
        const r = fmtAnswerForDisplay(q, row, ca, answers);
        return { pl, text:r.text, status:r.status, points:r.points||0, right:(r.status==='correct' || r.status==='partial') };
      });
      let kind;
      if(ca && ca.void) kind = 'void';
      else if(!ca) kind = 'none';
      else if(ca.open) kind = 'open';
      else kind = per.some(p=>p.status==='pending') ? 'open' : 'settled';
      return { q, ca, live, per, kind, right: per.filter(p=>p.right) };
    });
  }

  function qPill(m, mine){
    if(m.kind==='void') return { c:'dn', l:'Void' };
    if(m.kind==='none') return { c:'dn', l:'Not marked' };
    if(!mine) return m.kind==='open' ? { c:'op', l:'Still open' } : { c:'dn', l:'Settled' };
    if(mine.status==='unanswered') return { c:'dn', l:'No answer' };
    if(m.kind==='open') return mine.right ? { c:'ok', l:'On track' } : { c:'no', l:'Off track' };
    return mine.right ? { c:'ok', l:'Correct' } : { c:'no', l:'Wrong' };
  }

  function qAvatars(m, youId){
    if(m.kind==='void') return '<span class="v2-none">Question voided</span>';
    if(m.kind==='none') return '<span class="v2-none">Not marked yet</span>';
    if(!m.right.length) return '<span class="v2-none">Nobody yet</span>';
    const r = m.right.slice().sort((a,b)=> (a.pl.id===youId?-1:0) - (b.pl.id===youId?-1:0));
    const max = 4;
    let h = r.slice(0,max).map(p=>`<div class="v2-a${p.pl.id===youId?' me':''}" title="${esc(p.pl.name)}">${esc(p.pl.name.slice(0,2).toUpperCase())}</div>`).join('');
    if(r.length>max) h += `<div class="v2-a more">+${r.length-max}</div>`;
    return `<div class="v2-av">${h}</div>`;
  }

  function renderQuestionsPlayerAnswers(){
    if(!questionsTabData) return;
    const youId = document.getElementById('questionsPlayerSelect').value;
    const models = buildQuestionModels();
    const nPlayers = questionsTabData.players.length;
    const mineOf = m => youId ? m.per.find(p=>p.pl.id===youId) : null;

    const sumEl = document.getElementById('qSummary');
    if(youId){
      const total = computeQuestionsPoints(youId, questionsTabData.answers, questionsTabData.questions);
      const nRight = models.filter(m=>{ const x=mineOf(m); return x && x.right; }).length;
      sumEl.innerHTML = `<div class="v2-summary"><div class="v2-box"><div class="k">Your question points</div><div class="v">${total}</div></div><div class="v2-box"><div class="k">Questions scoring for you</div><div class="v">${nRight} of ${QUESTIONS.length}</div></div></div>`;
    } else sumEl.innerHTML = '';

    if(!youId && (qFilter==='ok' || qFilter==='no')) qFilter = 'all';
    const filters = [['all','All'],['open','Still open'],['settled','Settled']];
    if(youId) filters.splice(1,0,['ok','You are on track'],['no','You are off track']);
    document.getElementById('qFilters').innerHTML = filters.map(f=>`<button class="v2-chip${qFilter===f[0]?' on':''}" data-f="${f[0]}">${f[1]}</button>`).join('');

    const tiles = models.filter(m=>{
      const pill = qPill(m, mineOf(m));
      if(qFilter==='open') return m.kind==='open';
      if(qFilter==='settled') return m.kind==='settled';
      if(qFilter==='ok') return pill.c==='ok';
      if(qFilter==='no') return pill.c==='no';
      return true;
    }).map(m=>{
      const q = m.q, mine = mineOf(m), pill = qPill(m, mine);
      const foot = youId ? `<div class="v2-ft"><span>Your points${m.kind==='open'?' so far':''}</span>${mine && mine.points>0 ? `<b>+${mine.points}</b>` : '<b class="z">0</b>'}</div>` : '';
      return `<button class="v2-tile${qSel===q.id?' sel':''}" data-q="${q.id}">
        <div class="v2-tn"><span class="v2-qn">Q${q.id} · up to ${maxPtsOf(q)} pts</span><span class="v2-pill ${pill.c}">${pill.l}</span></div>
        <div class="v2-tt">${esc(q.short)}</div>
        <div class="v2-live">${m.live ? esc(m.live) : '&nbsp;'}</div>
        <div class="v2-rt"><div class="l">Getting it right now (${m.right.length} of ${nPlayers})</div>${qAvatars(m, youId)}</div>
        ${foot}</button>`;
    }).join('');
    document.getElementById('qGrid').innerHTML = tiles || '<div class="v2-none" style="color:#B9C4BB;">Nothing here.</div>';

    const m = models.find(x=>x.q.id===qSel) || models[0];
    const q = m.q, mine = mineOf(m), pill = qPill(m, mine);
    let msg;
    if(m.kind==='void') msg = 'This question was voided, so nobody scores on it.';
    else if(m.kind==='none') msg = 'Not marked yet, so no points are on the board for this one.';
    else if(m.kind==='open') msg = mine
      ? (mine.status==='unanswered' ? 'You did not answer this one.'
        : mine.right ? `You are on track. Your answer matches so far and is scoring ${mine.points} pts, but the question is still open.`
        : 'You are off track right now, but the question is still open, so it can still change.')
      : `${m.right.length} of ${nPlayers} players are matching so far. The question is still open.`;
    else msg = mine
      ? (mine.status==='unanswered' ? 'You did not answer this one.'
        : mine.right ? `Settled. You scored ${mine.points} pts.` : 'Settled. Your answer did not score.')
      : `Settled. ${m.right.length} of ${nPlayers} players scored.`;
    const rows = m.per.slice().sort((a,b)=> b.points-a.points || a.pl.name.localeCompare(b.pl.name)).map(p=>{
      const ptsTxt = p.status==='unanswered' ? '—' : p.right ? '+'+p.points : (m.kind==='open' ? '0 so far' : '0');
      return `<tr class="${p.pl.id===youId?'me':''}"><td class="pname">${esc(p.pl.name)}${p.pl.id===youId?' (you)':''}</td><td class="psub" style="white-space:normal;">${esc(p.text)}</td><td class="num ${p.right?'ptotal':'psub'}">${ptsTxt}</td></tr>`;
    }).join('');
    document.getElementById('qPanel').innerHTML = `
      <h3>Q${q.id}: ${esc(q.short)}</h3>
      ${typeof q.label==='string' ? `<div class="lbl">${esc(q.label)}</div>` : ''}
      <div class="v2-boxes">
        ${mine ? `<div class="v2-box"><div class="k">Your answer</div><div class="v">${esc(mine.text)}</div></div>` : ''}
        <div class="v2-box"><div class="k">Points on offer</div><div class="v">${esc(q.pointsText||'')}</div></div>
        ${mine ? `<div class="v2-box"><div class="k">Your points${m.kind==='open'?' so far':''}</div><div class="v">${mine.points>0?'+'+mine.points:'0'}</div></div>` : ''}
        ${m.live ? `<div class="v2-box"><div class="k">Live update</div><div class="v">${esc(m.live)}</div></div>` : ''}
      </div>
      <div class="v2-msg ${mine?pill.c:'dn'}">${msg}</div>
      <div style="overflow-x:auto;"><table><tr><th>Player</th><th>Answer</th><th class="num">Points${m.kind==='open'?' so far':''}</th></tr>${rows}</table></div>`;

    document.querySelectorAll('#qFilters .v2-chip').forEach(b=>b.addEventListener('click', ()=>{ qFilter=b.dataset.f; renderQuestionsPlayerAnswers(); }));
    document.querySelectorAll('#qGrid .v2-tile').forEach(b=>b.addEventListener('click', ()=>{ qSel=+b.dataset.q; renderQuestionsPlayerAnswers(); }));
  }

  async function initLeaderboard(){
    if(!sb){
      document.getElementById('leaderboardMainContent').style.display = 'block';
      renderLeaderboard();
      return;
    }
    const { data } = await sb.from('settings').select('*').eq('key','leaderboard_open').maybeSingle();
    const isOpen = data ? data.value === 'true' : false;
    if(!isOpen){
      document.getElementById('leaderboardLockedNotice').style.display = 'block';
      return;
    }
    document.getElementById('leaderboardMainContent').style.display = 'block';
    renderLeaderboard();
    setInterval(()=>{ document.getElementById('tabLeaderboard').classList.contains('active') && renderLeaderboard(); }, 30000);
  }
  initLeaderboard();
</script>
